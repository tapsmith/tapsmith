[package]
name = "tapsmith-core"
version = "0.7.0"
edition = "2021"
description = "Tapsmith mobile testing framework - core daemon"
license = "Apache-2.0"

[[bin]]
name = "tapsmith-core"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
# HTTP/2 MITM interception (PILOT-245). `h2` is already in the lock file as a
# transitive dep of tonic; promoting it to a direct dep lets the proxy frame
# h2 itself. `http` provides the Request/Response/HeaderMap types h2 uses.
h2 = "0.4"
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
x509-parser = "0.16"
md-5 = "0.10"
time = { version = "0.3", features = ["parsing", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
dirs = "6.0.0"
async-trait = "0.1"
regex = "1"
url = "2"
crc32fast = "1.4"
plist = "1.7"
tempfile = "3"
# Used to send SIGINT/SIGTERM to recording child processes (ffmpeg / simctl
# recordVideo) so they finalise the MP4 before exit. tokio::process exposes
# only kill(), which sends SIGKILL and leaves un-finalised files.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
