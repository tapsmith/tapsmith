name: TapsmithNativeTestApp
options:
  bundleIdPrefix: dev.tapsmith
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  TapsmithNativeTestApp:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tapsmith.nativetestapp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Tapsmith Native"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.tapsmith.nativetestapp
            CFBundleURLSchemes: [tapsmithnative]
        UILaunchScreen: {}
