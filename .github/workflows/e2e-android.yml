name: E2E Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-android-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Tapsmith's own CI is not a user; keep its runs out of the usage counts.
  TAPSMITH_TELEMETRY: "0"
  ANDROID_API_LEVEL: "36"
  # Google APIs, not AOSP. Swapping to `default` would remove the Google Play
  # services ANR storm that killed a shard on an oversubscribed runner (the
  # reason this workflow was hardened), and PR #231 got two of the three
  # blockers out of the way before stopping:
  #
  #   1. FIXED - the hooks marker was occluded by AOSP's three-button taskbar,
  #      so every warm reset degraded to clear. TapsmithTestHooks.tsx now
  #      carries it on a full-bleed node nothing can hide.
  #   2. FIXED - the same taskbar occluded ordinary content at the bottom of a
  #      scroll view (visibility.test.ts's error text), because the test app
  #      does not inset for navigation bars. Forcing gesture navigation with
  #      `adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural`
  #      fixes it; verified working, that failure did not recur.
  #   3. OPEN - on AOSP a file reset can leave the LAUNCHER in the foreground
  #      instead of the app: "hierarchy ... not ready 60000ms after launch;
  #      last hierarchy showed packages: com.android.launcher3". Reproduced on
  #      app-state.test.ts and auth-gate.test.ts across two separate runs, with
  #      and without gesture navigation. Unexplained; that is where to start.
  #
  # Also confirmed working on AOSP, so do not re-derive it: WebView
  # (com.android.webview, CDP and all), Multi-device, and the reset ladder.
  ANDROID_SYSTEM_IMAGE: "system-images;android-36;google_apis;x86_64"
  AVD_NAME: "Tapsmith_Phone_API_36"
  SHARD_TOTAL: 5
  # Cached login state for the `authenticated` project. Shards restore it
  # before the test step; ci-projects.mjs drops the `authentication` setup
  # project when the archive is present. Bump the -v suffix if the daemon's
  # app-state archive layout changes incompatibly.
  AUTH_STATE_ARCHIVE: e2e/tapsmith-results/auth-state-authentication.tar.gz
  AUTH_STATE_CACHE_VERSION: v1

jobs:
  # ─── Build prerequisites (parallel) ────────────────────────────────────

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dist/ is platform-independent (tsc output, proto copy, iOS agent
      # sources, vite web bundles), so build it once here instead of in each
      # of the shard jobs and the report job.
      - name: Cache SDK build
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: packages/tapsmith/dist
          key: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}

      - uses: actions/setup-node@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install and build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          retention-days: 1
          path: packages/tapsmith/dist/

  build-daemon:
    name: Build Daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        working-directory: packages/tapsmith-core
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-binary
          retention-days: 1
          path: packages/tapsmith-core/target/release/tapsmith-core

  build-agent:
    name: Build Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            agent/.gradle
          key: ${{ runner.os }}-gradle-agent-${{ hashFiles('agent/**/*.gradle.kts',
            'agent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-agent-

      - name: Build agent APKs
        working-directory: agent
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: agent-apks
          retention-days: 1
          path: |
            agent/app/build/outputs/apk/debug/app-debug.apk
            agent/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  build-test-app:
    name: Build Test App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache test app APK
        id: test-app-cache
        uses: actions/cache@v4
        with:
          path: test-app/android/app/build/outputs/apk/release/app-release.apk
          key: test-app-android-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/plugins/**', 'test-app/package-lock.json',
            'test-app/app.json', 'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - uses: actions/setup-node@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Build @tapsmith/react-native (test-app dependency)
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        env:
          # Release builds strip __DEV__; the flag keeps the in-app reset hooks on.
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform android

      - name: Build release APK
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/android
        env:
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: test-app-apk
          retention-days: 1
          path: test-app/android/app/build/outputs/apk/release/app-release.apk

  # ─── Sharded E2E execution ─────────────────────────────────────────────

  e2e-test:
    name: "Shard ${{ matrix.shard }}/5"
    needs: [ build-sdk, build-daemon, build-agent, build-test-app ]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5 ]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK environment
        run: |
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> $GITHUB_ENV
          # ANDROID_HOME is a runner-machine variable, invisible to the
          # `env` expression context — without this export the system-image
          # cache step below resolves its path to "/system-images" and never
          # saves anything (every shard re-downloaded the image, ~55 s).
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary
          path: packages/tapsmith-core/target/release

      - name: Download agent APKs
        uses: actions/download-artifact@v4
        with:
          name: agent-apks
          path: agent/app/build/outputs/apk

      - name: Download test app APK
        uses: actions/download-artifact@v4
        with:
          name: test-app-apk
          path: e2e/fixtures

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        run: chmod +x packages/tapsmith-core/target/release/tapsmith-core

      - name: Cache Android system image
        id: system-image-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-image-${{ env.ANDROID_SYSTEM_IMAGE }}-v1

      - name: Install Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: echo "y" | sdkmanager --install "${{ env.ANDROID_SYSTEM_IMAGE }}"

      # Not preinstalled on the runner image — every run before the cache fix
      # above was getting it as an implicit dependency of the system-image
      # install, so the very first cache HIT skipped that install and broke
      # `avdmanager create avd` with '"emulator" package must be installed!'.
      # Unconditional and idempotent: ~15 s when already present.
      - name: Install Android emulator package
        run: echo "y" | sdkmanager --install emulator

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n "${{ env.AVD_NAME }}" \
            -k "${{ env.ANDROID_SYSTEM_IMAGE }}" \
            --device "pixel_6" \
            --force

      - name: Boot emulator
        run: |
          nohup emulator -avd "${{ env.AVD_NAME }}" \
            -no-window -no-audio -no-snapshot-save \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -memory 4096 \
            &>/tmp/emulator.log &
          echo "Waiting for emulator to boot..."
          # Every probe is `timeout`-wrapped: a wall-clock loop is only
          # bounded if each iteration returns. An emulator that registers with
          # adb but whose shell never answers would otherwise block inside a
          # single `adb shell` forever, and the deadline below would never be
          # re-tested. The `| tr` keeps the pipeline's status zero under
          # `bash -e` when timeout kills the probe (exit 124).
          #
          # Wall-clock bounded, not tick-counted: `adb shell getprop` itself
          # takes seconds on a loaded runner, so the old "decrement a counter
          # by 2 per iteration" loop was a *poll count*, not a timeout — a
          # nominal 120s ran for 229s on the runner that motivated this change.
          #
          # No `adb wait-for-device` in front of it either: that blocks forever
          # for an emulator that never registers, which would put an unbounded
          # wait ahead of the deadline and defeat the point. The poll below
          # already tolerates an absent device (`getprop` fails, BOOT stays
          # empty), exactly as the multi-device job does.
          BOOT_DEADLINE=$(( $(date +%s) + 300 ))
          BOOT=""
          while [ "$(date +%s)" -lt "$BOOT_DEADLINE" ]; do
            BOOT=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          # The sleep can carry the loop past the deadline, leaving the last
          # interval unprobed — so the budget is only really honoured with one
          # final read before declaring the emulator dead.
          if [ "$BOOT" != "1" ]; then
            BOOT=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          fi
          if [ "$BOOT" != "1" ]; then
            echo "::error::Emulator failed to boot within 300s"
            cat /tmp/emulator.log | tail -30
            exit 1
          fi
          # Disable animations for test stability
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Emulator booted and ready ($(adb shell getprop ro.build.display.id))"

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/cli.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # Exact-key match only: a stale login state for a different test-app
      # build must fall through to a fresh auth.setup run, never be reused.
      - name: Restore cached auth state
        id: auth-state-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AUTH_STATE_ARCHIVE }}
          key: auth-state-android-${{ env.AUTH_STATE_CACHE_VERSION }}-${{
            hashFiles('test-app/app/**', 'test-app/assets/**', 'test-app/plugins/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js', 'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}-${{
            hashFiles('e2e/tests/auth.setup.ts', 'e2e/fixtures.ts', 'e2e/screens/**') }}

      # `retries: 2` in the config covers a flaky *test*. It cannot cover a
      # session preflight that fails before the first test starts: that aborts
      # the shard with no blob report at all, so one emulator blip costs every
      # test in the shard and the merged report has a hole in it. Retry exactly
      # that case, once — a run that produced results failed on its merits and
      # must never be re-run here, or a real regression would be retried into
      # green.
      - name: Run E2E tests
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-android-${{ matrix.shard }}.log
        run: |
          SERIAL=$(adb devices | grep -w device | head -1 | awk '{print $1}')
          run_shard() {
            npx tapsmith test -c tapsmith.config.android-ci.mjs \
              --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} \
              --workers 1 \
              --device "$SERIAL"
          }

          # `|| STATUS=$?` is load-bearing: the step runs under `bash -e`, so a
          # bare `run_shard` that exits non-zero would abort the step here and
          # never reach the retry decision below.
          STATUS=0
          run_shard || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then exit 0; fi

          if [ -n "$(ls -A blob-report 2>/dev/null)" ]; then
            echo "Shard produced results; the failure is the tests', not the session's."
            exit "$STATUS"
          fi

          # Preserve attempt 1's evidence: the collection step below runs once,
          # after the retry, and would otherwise only ever show the attempt that
          # succeeded — leaving the startup failure we are retrying invisible.
          echo "::warning::Shard produced no results (session startup failed); retrying once."
          mkdir -p tapsmith-results
          for log in /tmp/tapsmith-daemon-android-${{ matrix.shard }}*.log; do
            [ -e "$log" ] || continue
            cp "$log" "tapsmith-results/$(basename "$log" .log)-attempt1.log"
          done
          adb logcat -d -v time TapsmithAgent:V TapsmithSocket:V TestRunner:V \
            AndroidRuntime:E ActivityManager:I ReactNativeJS:V '*:W' \
            > "tapsmith-results/logcat-${{ matrix.shard }}-attempt1.txt" 2>&1 || true
          adb logcat -c || true

          run_shard

      # Only shards that ran auth.setup produce the archive (hashFiles is
      # empty otherwise), and only a green run may seed the cache. The
      # archive is the app's data dir (restoreAppState re-owns it to the
      # app uid on the target emulator); the test app has no AndroidKeyStore
      # keys, so there's no device-bound member to strip.
      - name: Save auth state to cache
        if: >-
          success() && steps.auth-state-cache.outputs.cache-hit != 'true'
          && hashFiles(env.AUTH_STATE_ARCHIVE) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AUTH_STATE_ARCHIVE }}
          key: ${{ steps.auth-state-cache.outputs.cache-primary-key }}

      # Record one trace against the live emulator and assert what is inside
      # it: decodable screenshots at the device's real resolution, hierarchy
      # dumps that contain the element each action resolved, and the app's real
      # HTTPS traffic. The sharded run above records `retain-on-failure`
      # traces nobody opens, so nothing else here would notice a trace that
      # packages successfully but holds the wrong data. One shard is enough —
      # this verifies the recording path, not the tests.
      - name: Verify trace archive contents
        if: matrix.shard == 1
        working-directory: e2e
        run: |
          SERIAL=$(adb devices | grep -w device | head -1 | awk '{print $1}')
          node verify-trace-archive.mjs \
            -c tapsmith.config.android-ci.mjs \
            --device "$SERIAL"

      # The daemon log, the agent's `am instrument` output and a logcat dump
      # are the only record of an agent that died before the first test ran
      # (the shard then has no results at all). Copied into tapsmith-results
      # so the existing upload picks them up.
      - name: Collect daemon log and logcat
        if: always()
        run: |
          mkdir -p e2e/tapsmith-results
          for log in /tmp/tapsmith-daemon-android-${{ matrix.shard }}*.log; do
            [ -e "$log" ] || continue
            cp "$log" e2e/tapsmith-results/
          done
          adb logcat -d -v time TapsmithAgent:V TapsmithSocket:V TestRunner:V \
            AndroidRuntime:E ActivityManager:I ReactNativeJS:V '*:W' \
            > "e2e/tapsmith-results/logcat-${{ matrix.shard }}.txt" 2>&1 || true
          adb shell cat /data/local/tmp/tapsmith-agent.log \
            > "e2e/tapsmith-results/am-instrument-${{ matrix.shard }}.txt" 2>/dev/null || true

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          retention-days: 7
          path: e2e/blob-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Two-device run (PILOT-310) ───────────────────────────────────────

  # A `use.devices` project drives two emulators per test. It gets its own
  # job rather than a shard: the matrix boots one emulator per runner, and a
  # two-user test halves the parallelism of whatever hosts it. The workflow
  # boots the first emulator exactly as a shard does; Tapsmith launches the
  # second instance of the AVD itself (`avd` + `launchEmulators`) — the same
  # path a developer machine takes.
  e2e-multi-device:
    name: Multi-device
    needs: [ build-sdk, build-daemon, build-agent, build-test-app ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK environment
        run: |
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> $GITHUB_ENV
          # ANDROID_HOME is a runner-machine variable, invisible to the
          # `env` expression context — without this export the system-image
          # cache step below resolves its path to "/system-images" and never
          # saves anything (every shard re-downloaded the image, ~55 s).
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary
          path: packages/tapsmith-core/target/release

      - name: Download agent APKs
        uses: actions/download-artifact@v4
        with:
          name: agent-apks
          path: agent/app/build/outputs/apk

      - name: Download test app APK
        uses: actions/download-artifact@v4
        with:
          name: test-app-apk
          path: e2e/fixtures

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        run: chmod +x packages/tapsmith-core/target/release/tapsmith-core

      - name: Cache Android system image
        id: system-image-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-image-${{ env.ANDROID_SYSTEM_IMAGE }}-v1

      - name: Install Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: echo "y" | sdkmanager --install "${{ env.ANDROID_SYSTEM_IMAGE }}"

      # Not preinstalled on the runner image — every run before the cache fix
      # above was getting it as an implicit dependency of the system-image
      # install, so the very first cache HIT skipped that install and broke
      # `avdmanager create avd` with '"emulator" package must be installed!'.
      # Unconditional and idempotent: ~15 s when already present.
      - name: Install Android emulator package
        run: echo "y" | sdkmanager --install emulator

      # Two AVDs from the same image, one per group member. A second
      # `-read-only` instance of a single AVD never registered with adb on
      # these runners; two independent writable instances boot the way the
      # shard jobs' single emulator does.
      - name: Create two AVDs
        run: |
          for NAME in "${{ env.AVD_NAME }}" "${{ env.AVD_NAME }}-2"; do
            echo "no" | avdmanager create avd \
              -n "$NAME" \
              -k "${{ env.ANDROID_SYSTEM_IMAGE }}" \
              --device "pixel_6" \
              --force
          done

      # Both members of the group boot here, side by side, rather than letting
      # Tapsmith launch the second: a cold emulator started after the first one
      # is already up (and the app installed) has blown through the 120 s boot
      # wait on these 4-core runners. Two cold boots in parallel finish while
      # the SDK and E2E dependencies install.
      - name: Boot two emulators
        run: |
          nohup emulator -avd "${{ env.AVD_NAME }}" -port 5554 \
            -no-window -no-audio -no-snapshot-save \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -memory 3072 \
            &>/tmp/emulator-5554.log &
          nohup emulator -avd "${{ env.AVD_NAME }}-2" -port 5556 \
            -no-window -no-audio -no-snapshot-save \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -memory 3072 \
            &>/tmp/emulator-5556.log &
          echo "Waiting for both emulators to boot..."
          # Polling `getprop` (not `adb wait-for-device`, which blocks forever
          # for a serial that never registers) keeps a dead emulator a bounded
          # failure with its log attached.
          for SERIAL in emulator-5554 emulator-5556; do
            # Per emulator: a slow first boot must not eat into the second's budget.
            TIMEOUT=300
            BOOT=""

            # Wall-clock bounded — see the single-emulator job for why a
            # counter decremented per iteration is not a timeout.
            DEADLINE=$(( $(date +%s) + TIMEOUT ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              BOOT=$(timeout 10 adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT" = "1" ]; then break; fi
              sleep 2
            done
            # One final read before giving up: the sleep can carry the loop
            # past the deadline while the emulator finished booting inside it,
            # leaving BOOT stale. Same guard as the single-emulator jobs.
            if [ "$BOOT" != "1" ]; then
              BOOT=$(timeout 10 adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            fi
            if [ "$BOOT" != "1" ]; then
              echo "::error::$SERIAL failed to boot within 300s"
              adb devices
              tail -40 "/tmp/$SERIAL.log"
              exit 1
            fi
            # Disable animations for test stability
            adb -s "$SERIAL" shell settings put global window_animation_scale 0
            adb -s "$SERIAL" shell settings put global transition_animation_scale 0
            adb -s "$SERIAL" shell settings put global animator_duration_scale 0
            echo "$SERIAL booted and ready ($(adb -s "$SERIAL" shell getprop ro.build.display.id))"
          done

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/cli.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # The primary is pinned with --device and the member through the CI
      # config (`TAPSMITH_ANDROID_MEMBER` → `bob.device`), so the group is
      # exactly the two emulators booted above.
      - name: Run two-device E2E tests
        working-directory: e2e
        env:
          TAPSMITH_ANDROID_MEMBER: emulator-5556
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-android-multi.log
        run: |
          npx tapsmith test -c tapsmith.config.android-multi-ci.mjs \
            --trace on \
            --device emulator-5554

      # The daemon log, the agent's `am instrument` output and a logcat dump
      # are the only record of an agent that died before the first test ran
      # (the shard then has no results at all). Copied into tapsmith-results
      # so the existing upload picks them up.
      - name: Collect daemon log and logcat
        if: always()
        run: |
          mkdir -p e2e/tapsmith-results
          for log in /tmp/tapsmith-daemon-android-multi*.log; do
            [ -e "$log" ] || continue
            cp "$log" e2e/tapsmith-results/
          done
          for serial in $(adb devices | awk 'NR>1 && $2=="device" {print $1}'); do
            adb -s "$serial" logcat -d -v time TapsmithAgent:V TapsmithSocket:V TestRunner:V \
              AndroidRuntime:E ActivityManager:I ReactNativeJS:V '*:W' \
              > "e2e/tapsmith-results/logcat-$serial.txt" 2>&1 || true
            adb -s "$serial" shell cat /data/local/tmp/tapsmith-agent.log \
              > "e2e/tapsmith-results/am-instrument-$serial.txt" 2>/dev/null || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-multi-device
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Merge shard reports ───────────────────────────────────────────────

  e2e-report:
    name: Merge Reports
    needs: [ build-sdk, e2e-test ]
    if: always() && needs.build-sdk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/cli.js

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Merge reports
        working-directory: e2e
        run: npx tapsmith merge-reports ../all-blob-reports -c
          tapsmith.config.android-ci.mjs

      # always(): merge-reports exits 1 when a shard's blob is missing, but it
      # still writes the report for the shards that did finish.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          retention-days: 30
          path: e2e/tapsmith-report/
