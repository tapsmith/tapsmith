name: Preview Trace Viewer

on:
  pull_request:
    paths:
      - 'packages/tapsmith/src/trace-viewer/**'
      - 'packages/tapsmith/src/trace/**'
      - 'packages/tapsmith/vite.config.ts'
      - '.github/workflows/preview-trace-viewer.yml'

concurrency:
  group: preview-trace-viewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy Preview
    # Fork PRs get no secrets, so the Cloudflare deploy can't run for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tapsmith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build trace viewer
        run: npx vite build

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/trace-viewer --project-name=tapsmith-trace --branch=${{ github.head_ref }}
          workingDirectory: packages/tapsmith

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trace-viewer-preview
          message: |
            **Trace Viewer Preview** 🔍

            Deployed to: ${{ steps.deploy.outputs.deployment-url }}

            _Updated: ${{ github.event.pull_request.head.sha }}_
