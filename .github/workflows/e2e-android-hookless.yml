name: E2E Android (hook-less)

# The out-of-the-box reset path: the test app built WITHOUT
# EXPO_PUBLIC_TAPSMITH_HOOKS, so the daemon detects no in-app hooks —
# `appReset: 'auto'` resolves to clear · file, deep links settle through the
# resumed-activity heuristic instead of the nav-counter ack, and warm requests
# fall back honestly. The regular device e2e suites can't cover this: their
# builds always compile the hooks in.
#
# Weekly (plus manual dispatch) rather than per-PR — the hook-less code paths
# change rarely, and the per-PR suites keep covering the cold rungs themselves
# (explicit restart/clear tests, appState restores, the cold valve, retries).
# The pull_request paths filter runs it early on the few files that define the
# hook-less behaviour; broader daemon changes are caught by the weekly run.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  # Every PR, whatever its base (stacked PRs; see ci.yml).
  pull_request:
    paths:
      - ".github/workflows/e2e-android-hookless.yml"
      - "e2e/tapsmith.config.android-ci-hookless.mjs"
      - "e2e/tests/app-reset.hookless.ts"
      - "packages/tapsmith-core/src/app_reset.rs"
      - "packages/tapsmith/src/app-reset.ts"
      - "packages/tapsmith/src/session-preflight.ts"
      - "packages/tapsmith-react-native/src/enabled.ts"

concurrency:
  group: e2e-android-hookless-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Tapsmith's own CI is not a user; keep its runs out of the usage counts.
  TAPSMITH_TELEMETRY: "0"
  ANDROID_API_LEVEL: "36"
  ANDROID_SYSTEM_IMAGE: "system-images;android-36;google_apis;x86_64"
  AVD_NAME: "Tapsmith_Phone_API_36"

jobs:
  # ─── Build prerequisites (parallel) ────────────────────────────────────

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same cache as the main e2e workflows, so a PR that already built the
      # SDK there hits it here.
      - name: Cache SDK build
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/tapsmith/dist
          key: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install and build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith
        run: npm ci && npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-dist
          retention-days: 1
          path: packages/tapsmith/dist/

  build-daemon:
    name: Build Daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        working-directory: packages/tapsmith-core
        run: cargo build --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-binary
          retention-days: 1
          path: packages/tapsmith-core/target/release/tapsmith-core

  build-agent:
    name: Build Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            agent/.gradle
          key: ${{ runner.os }}-gradle-agent-${{ hashFiles('agent/**/*.gradle.kts',
            'agent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-agent-

      - name: Build agent APKs
        working-directory: agent
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-apks
          retention-days: 1
          path: |
            agent/app/build/outputs/apk/debug/app-debug.apk
            agent/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  build-test-app:
    name: Build Test App (no hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Distinct key from the hooked APK: the flag is inlined into the bundle,
      # so the two builds must never share a cache entry.
      - name: Cache hook-less test app APK
        id: test-app-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: test-app/android/app/build/outputs/apk/release/app-release.apk
          key: test-app-android-hookless-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/plugins/**', 'test-app/package-lock.json',
            'test-app/app.json', 'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      # The app imports the package regardless; without the flag the hooks
      # render nothing — which is exactly what this workflow verifies.
      - name: Build @tapsmith/react-native (test-app dependency)
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      # No EXPO_PUBLIC_TAPSMITH_HOOKS: release builds strip __DEV__, so the
      # hooks are compiled out — the production default.
      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform android

      - name: Build release APK
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-app-apk-hookless
          retention-days: 1
          path: test-app/android/app/build/outputs/apk/release/app-release.apk

  # ─── E2E execution (single job, no shards, no auth project) ────────────

  e2e-test:
    name: Hook-less suite
    needs: [ build-sdk, build-daemon, build-agent, build-test-app ]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK environment
        run: |
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> $GITHUB_ENV
          # ANDROID_HOME is a runner-machine variable, invisible to the
          # `env` expression context — without this export the system-image
          # cache step below resolves its path to "/system-images".
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Download daemon binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daemon-binary
          path: packages/tapsmith-core/target/release

      - name: Download agent APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-apks
          path: agent/app/build/outputs/apk

      - name: Download test app APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-app-apk-hookless
          path: e2e/fixtures

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Download SDK build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        run: chmod +x packages/tapsmith-core/target/release/tapsmith-core

      - name: Cache Android system image
        id: system-image-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-image-${{ env.ANDROID_SYSTEM_IMAGE }}-v1

      - name: Install Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: echo "y" | sdkmanager --install "${{ env.ANDROID_SYSTEM_IMAGE }}"

      # Not preinstalled on the runner image; unconditional and idempotent.
      - name: Install Android emulator package
        run: echo "y" | sdkmanager --install emulator

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n "${{ env.AVD_NAME }}" \
            -k "${{ env.ANDROID_SYSTEM_IMAGE }}" \
            --device "pixel_6" \
            --force

      - name: Boot emulator
        run: |
          nohup emulator -avd "${{ env.AVD_NAME }}" \
            -no-window -no-audio -no-snapshot-save \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -memory 4096 \
            &>/tmp/emulator.log &
          echo "Waiting for emulator to boot..."
          # Wall-clock bounded, and no `adb wait-for-device` ahead of it — see
          # e2e-android.yml for both rationales.
          BOOT_DEADLINE=$(( $(date +%s) + 300 ))
          BOOT=""
          while [ "$(date +%s)" -lt "$BOOT_DEADLINE" ]; do
            BOOT=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          # One final read: the sleep can carry the loop past the deadline and
          # leave the last interval unprobed. See e2e-android.yml.
          if [ "$BOOT" != "1" ]; then
            BOOT=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          fi
          if [ "$BOOT" != "1" ]; then
            echo "::error::Emulator failed to boot within 300s"
            cat /tmp/emulator.log | tail -30
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Emulator booted and ready ($(adb shell getprop ro.build.display.id))"

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/bin.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Run hook-less E2E tests
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-android-hookless.log
        run: |
          SERIAL=$(adb devices | grep -w device | head -1 | awk '{print $1}')
          npx tapsmith test -c tapsmith.config.android-ci-hookless.mjs \
            --workers 1 \
            --device "$SERIAL"

      # The daemon log, the agent's `am instrument` output and a logcat dump
      # are the only record of an agent that died before the first test ran
      # (the shard then has no results at all). Copied into tapsmith-results
      # so the existing upload picks them up.
      - name: Collect daemon log and logcat
        if: always()
        run: |
          mkdir -p e2e/tapsmith-results
          for log in /tmp/tapsmith-daemon-android-hookless*.log; do
            [ -e "$log" ] || continue
            cp "$log" e2e/tapsmith-results/
          done
          # Bounded: with no emulator (an earlier setup step failed) adb waits
          # for a device until the job times out.
          timeout 30 adb logcat -d -v time TapsmithAgent:V TapsmithSocket:V TestRunner:V \
            AndroidRuntime:E ActivityManager:I ReactNativeJS:V '*:W' \
            > "e2e/tapsmith-results/logcat-hookless.txt" 2>&1 || true
          timeout 30 adb shell cat /data/local/tmp/tapsmith-agent.log \
            > "e2e/tapsmith-results/am-instrument-hookless.txt" 2>/dev/null || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hookless-report
          retention-days: 30
          path: e2e/tapsmith-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hookless-results
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz
