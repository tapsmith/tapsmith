name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─── Build Rust daemon for all platforms ───
  build-daemon:
    name: Build daemon (${{ matrix.npm-pkg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm-pkg: core-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm-pkg: core-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: core-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: core-linux-arm64
            use-cross: true
    defaults:
      run:
        working-directory: packages/tapsmith-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      # cross mounts only the crate directory into Docker, so the monorepo-relative
      # proto path (../../proto/) doesn't exist inside the container. Copy it into
      # the crate so build.rs can find it in both native and cross builds.
      - name: Copy proto for cross builds
        if: matrix.use-cross
        run: |
          mkdir -p proto
          cp ../../proto/tapsmith.proto proto/

      - name: Build release binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        run: |
          BINARY=target/${{ matrix.target }}/release/tapsmith-core
          if command -v strip &> /dev/null; then
            strip "$BINARY" 2>/dev/null || true
          fi
          HELPER=target/${{ matrix.target }}/release/tapsmith-ios-hid
          if [ -f "$HELPER" ] && command -v strip &> /dev/null; then
            strip "$HELPER" 2>/dev/null || true
          fi

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -s - target/${{ matrix.target }}/release/tapsmith-core
          HELPER=target/${{ matrix.target }}/release/tapsmith-ios-hid
          if [ -f "$HELPER" ]; then codesign -s - "$HELPER"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.npm-pkg }}
          path: |
            packages/tapsmith-core/target/${{ matrix.target }}/release/tapsmith-core
            packages/tapsmith-core/target/${{ matrix.target }}/release/tapsmith-ios-hid

  # ─── Build Android agent APKs ───
  build-android-agent:
    name: Build Android agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            agent/.gradle
          key: release-gradle-${{ hashFiles('agent/**/*.gradle.kts', 'agent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            release-gradle-

      - name: Build agent APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Upload agent APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-apk
          path: agent/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload agent test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-test-apk
          path: agent/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  # ─── Build iOS simulator agent for arm64 and x64 ───
  # One row per iOS Simulator SDK the packages ship. The SDK uses a prebuilt
  # agent only when its `sdk-<version>/` matches the installed simulator SDK
  # exactly (`xcrun --show-sdk-version --sdk iphonesimulator`); on any other
  # SDK the first test run builds the agent from source (PILOT-773). So ship
  # the current stable Xcode, the previous release of its major, and the
  # newest Xcode of the previous major. Each row names its Xcode and checks the
  # SDK it reports, so a runner image change fails here rather than silently
  # shipping a duplicate SDK (both rows of the old matrix built 26.5).
  #
  # When Apple ships a new Xcode, add or move a row: `xcode` is the
  # `/Applications/Xcode_<xcode>.app` alias the image's README lists
  # (actions/runner-images), `sdk` the iOS Simulator SDK that Xcode bundles.
  # Never a beta: the release Xcode with the same SDK version would pick up
  # its build. Both architectures cross-compile (`ARCHS`) on any runner, so
  # one job per Xcode builds both packages.
  build-ios-simulator-agent:
    name: Build iOS simulator agent (Xcode ${{ matrix.xcode }}, SDK ${{ matrix.sdk }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            xcode: '27.1'
            sdk: '27.1'
          - runner: xcode-27
            xcode: '27.0'
            sdk: '27.0'
          - runner: macos-26
            xcode: '26.6'
            sdk: '26.5'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      SDK_VERSION: ${{ matrix.sdk }}
    defaults:
      run:
        working-directory: ios-agent
    steps:
      - uses: actions/checkout@v4

      - name: Check the Xcode and its simulator SDK
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on the ${{ matrix.runner }} image. Point this matrix row at an Xcode the image lists."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          FOUND_SDK="$(xcrun --show-sdk-version --sdk iphonesimulator)"
          if [ "$FOUND_SDK" != "$SDK_VERSION" ]; then
            echo "::error::Xcode ${{ matrix.xcode }} bundles iOS Simulator SDK $FOUND_SDK, but this matrix row says $SDK_VERSION. Update the row."
            exit 1
          fi

      - name: Build for testing
        run: |
          for ARCH in arm64 x86_64; do
            xcodebuild build-for-testing \
              -project TapsmithAgent.xcodeproj \
              -scheme TapsmithAgentUITests \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ".build-sim-${ARCH}" \
              ARCHS="${ARCH}" ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Stage package contents
        run: |
          stage() {
            local arch="$1" pkg="$2"
            local products=".build-sim-${arch}/Build/Products"
            local products_abs
            products_abs="$(cd "$products" && pwd)"
            local staging="../npm-packages/${pkg}/sdk-${SDK_VERSION}"
            mkdir -p "$staging"

            # Copy xctestrun file(s) and the test runner app bundle
            cp "$products"/*iphonesimulator*.xctestrun "$staging/"
            cp -R "$products/Debug-iphonesimulator" "$staging/"

            # Replace absolute DerivedData paths with __TAPSMITH_PKG__ placeholder
            for f in "$staging"/*.xctestrun; do
              plutil -convert xml1 "$f"
              sed -i '' "s|${products_abs}|__TAPSMITH_PKG__|g" "$f"
            done
          }
          stage arm64 agent-ios-simulator-arm64
          stage x86_64 agent-ios-simulator-x64

      # The artifact name carries the SDK, so two rows that build the same SDK
      # fail the second upload instead of one overwriting the other.
      - name: Upload artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-agent-agent-ios-simulator-arm64-sdk-${{ matrix.sdk }}
          path: npm-packages/agent-ios-simulator-arm64/sdk-*/
          if-no-files-found: error

      - name: Upload artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-agent-agent-ios-simulator-x64-sdk-${{ matrix.sdk }}
          path: npm-packages/agent-ios-simulator-x64/sdk-*/
          if-no-files-found: error

  # ─── Publish platform-specific binary packages ───
  publish-platform-packages:
    name: Publish @tapsmith/core-*
    needs: [build-daemon]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        pkg:
          - core-darwin-arm64
          - core-darwin-x64
          - core-linux-x64
          - core-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-${{ matrix.pkg }}
          path: npm-packages/${{ matrix.pkg }}/

      - name: Make binary executable
        run: |
          chmod +x npm-packages/${{ matrix.pkg }}/tapsmith-core
          if [ -f npm-packages/${{ matrix.pkg }}/tapsmith-ios-hid ]; then
            chmod +x npm-packages/${{ matrix.pkg }}/tapsmith-ios-hid
          fi

      # The postinstall chmod is gone (PILOT-437): npm keeps the tarball's
      # file modes on install, so the `chmod +x` above is the only thing that
      # makes the daemon runnable. download-artifact drops modes, so verify
      # what will actually be packed.
      - name: Verify package contents
        working-directory: npm-packages/${{ matrix.pkg }}
        run: |
          npm pack --dry-run --json --ignore-scripts > /tmp/pack.json
          node --input-type=module -e "
            import * as fs from 'node:fs';
            import { installScriptsOf, nonExecutableFiles, packEntry } from '../../packages/tapsmith/scripts/clean-install-checks.mjs';
            const entry = packEntry(fs.readFileSync('/tmp/pack.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const problems = [
              ...nonExecutableFiles(entry.files, pkg.files),
              ...installScriptsOf(pkg).map((script) => 'package.json declares ' + script),
            ];
            if (problems.length) {
              console.error('Packed tarball is not installable as-is: ' + problems.join('; '));
              process.exit(1);
            }
            console.log('Tarball OK: ' + entry.files.map((f) => f.path + ' ' + (f.mode & 0o777).toString(8)).join(', '));
          "

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm-packages/${{ matrix.pkg }}
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Check if package version already exists
        id: core_exists
        working-directory: npm-packages/${{ matrix.pkg }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.core_exists.outputs.exists != 'true'
        working-directory: npm-packages/${{ matrix.pkg }}
        # npm 11 refuses a prerelease without --tag (PILOT-541); every package
        # of one release goes under the same tag (latest, or beta for -beta.N).
        # `latest` is left implicit: an explicit `--tag latest` turns off npm's
        # refusal to move latest to a lower version (a hand-tagged backport).
        run: |
          DIST_TAG=$(node "$GITHUB_WORKSPACE/packages/tapsmith/scripts/npm-dist-tag.mjs" "${GITHUB_REF_NAME#v}")
          echo "Publishing ${GITHUB_REF_NAME#v} under dist-tag '$DIST_TAG'."
          if [ "$DIST_TAG" = latest ]; then
            npm publish --access public
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish iOS simulator agent packages ───
  publish-ios-simulator-packages:
    name: Publish @tapsmith/agent-ios-simulator-*
    needs: [build-ios-simulator-agent]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        pkg:
          - agent-ios-simulator-arm64
          - agent-ios-simulator-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download iOS simulator agent builds (one per SDK)
        uses: actions/download-artifact@v4
        with:
          pattern: ios-sim-agent-${{ matrix.pkg }}-sdk-*
          path: npm-packages/${{ matrix.pkg }}/
          merge-multiple: true

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm-packages/${{ matrix.pkg }}
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Guard against the v0.1.3–v0.1.7 regression where the npm `files`
      # globs silently dropped the Debug-iphonesimulator app bundle and
      # published xctestrun files that pointed at nothing. Checked per SDK:
      # the SDK only uses `sdk-<v>/` when its xctestrun is named for that same
      # SDK (`…_iphonesimulator<v>-<arch>.xctestrun`) and its bundle is there.
      - name: Verify package contents
        working-directory: npm-packages/${{ matrix.pkg }}
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map((f) => f.path);
            const sdks = [...new Set(files.map((p) => p.match(/^sdk-([^/]+)\//)?.[1]).filter(Boolean))].sort();
            const missing = [];
            if (!sdks.length) missing.push('sdk-<version>/');
            for (const sdk of sdks) {
              const inSdk = files.filter((p) => p.startsWith('sdk-' + sdk + '/'));
              if (!inSdk.some((p) => p.endsWith('.xctestrun') && p.includes('_iphonesimulator' + sdk + '-'))) {
                missing.push('sdk-' + sdk + '/*_iphonesimulator' + sdk + '-<arch>.xctestrun');
              }
              if (!inSdk.some((p) => /-iphonesimulator\/.*\.app\/PlugIns\/.*\.xctest\//.test(p))) {
                missing.push('sdk-' + sdk + '/<products>/<Runner>.app/PlugIns/*.xctest');
              }
            }
            if (missing.length) {
              console.error('Packed tarball is missing required contents: ' + missing.join(', '));
              console.error('Tarball files:\n  ' + files.join('\n  '));
              process.exit(1);
            }
            console.log('Tarball OK: ' + files.length + ' files, simulator SDKs ' + sdks.join(', '));
          "

      - name: Check if package version already exists
        id: ios_exists
        working-directory: npm-packages/${{ matrix.pkg }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.ios_exists.outputs.exists != 'true'
        working-directory: npm-packages/${{ matrix.pkg }}
        # npm 11 refuses a prerelease without --tag (PILOT-541); every package
        # of one release goes under the same tag (latest, or beta for -beta.N).
        # `latest` is left implicit: an explicit `--tag latest` turns off npm's
        # refusal to move latest to a lower version (a hand-tagged backport).
        run: |
          DIST_TAG=$(node "$GITHUB_WORKSPACE/packages/tapsmith/scripts/npm-dist-tag.mjs" "${GITHUB_REF_NAME#v}")
          echo "Publishing ${GITHUB_REF_NAME#v} under dist-tag '$DIST_TAG'."
          if [ "$DIST_TAG" = latest ]; then
            npm publish --access public
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish in-app reset hooks package ───
  publish-react-native:
    name: Publish @tapsmith/react-native
    # No build artifacts are consumed, but nothing should reach npm while the
    # release's builds are failing (skip-if-exists makes a re-run safe).
    needs: [build-daemon, build-android-agent, build-ios-simulator-agent]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tapsmith-react-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/tapsmith-react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        run: npm run build

      - name: Check if package version already exists
        id: rn_exists
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.rn_exists.outputs.exists != 'true'
        # npm 11 refuses a prerelease without --tag (PILOT-541); every package
        # of one release goes under the same tag (latest, or beta for -beta.N).
        # `latest` is left implicit: an explicit `--tag latest` turns off npm's
        # refusal to move latest to a lower version (a hand-tagged backport).
        run: |
          DIST_TAG=$(node "$GITHUB_WORKSPACE/packages/tapsmith/scripts/npm-dist-tag.mjs" "${GITHUB_REF_NAME#v}")
          echo "Publishing ${GITHUB_REF_NAME#v} under dist-tag '$DIST_TAG'."
          if [ "$DIST_TAG" = latest ]; then
            npm publish --access public
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish Android agent package ───
  publish-android-agent:
    name: Publish @tapsmith/agent-android
    needs: [build-android-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download Android agent APK
        uses: actions/download-artifact@v4
        with:
          name: android-agent-apk
          path: npm-packages/agent-android/

      - name: Download Android agent test APK
        uses: actions/download-artifact@v4
        with:
          name: android-agent-test-apk
          path: npm-packages/agent-android/

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm-packages/agent-android
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Check if package version already exists
        id: android_exists
        working-directory: npm-packages/agent-android
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.android_exists.outputs.exists != 'true'
        working-directory: npm-packages/agent-android
        # npm 11 refuses a prerelease without --tag (PILOT-541); every package
        # of one release goes under the same tag (latest, or beta for -beta.N).
        # `latest` is left implicit: an explicit `--tag latest` turns off npm's
        # refusal to move latest to a lower version (a hand-tagged backport).
        run: |
          DIST_TAG=$(node "$GITHUB_WORKSPACE/packages/tapsmith/scripts/npm-dist-tag.mjs" "${GITHUB_REF_NAME#v}")
          echo "Publishing ${GITHUB_REF_NAME#v} under dist-tag '$DIST_TAG'."
          if [ "$DIST_TAG" = latest ]; then
            npm publish --access public
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish main tapsmith package ───
  publish-tapsmith:
    name: Publish tapsmith
    needs: [publish-platform-packages, publish-ios-simulator-packages, publish-android-agent, publish-react-native]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tapsmith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            pkg.version = '$VERSION';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --package-lock-only

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1
          # Check critical files are present
          test -f dist/bin.js || (echo "Missing dist/bin.js" && exit 1)
          test -f dist/cli.js || (echo "Missing dist/cli.js" && exit 1)
          test -f dist/proto/tapsmith.proto || (echo "Missing dist/proto/tapsmith.proto" && exit 1)
          # Public export `tapsmith/trace-format.schema.json` (docs/trace-format.md)
          test -f dist/schema/trace-format.schema.json || (echo "Missing dist/schema/trace-format.schema.json" && exit 1)
          # Compiled unit tests must not ship (PILOT-438)
          test ! -e dist/__tests__ || (echo "dist/__tests__ must not be published" && exit 1)

      - name: Check if tapsmith version already exists
        id: tapsmith_exists
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "tapsmith@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tapsmith@${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.tapsmith_exists.outputs.exists != 'true'
        # npm 11 refuses a prerelease without --tag (PILOT-541); every package
        # of one release goes under the same tag (latest, or beta for -beta.N).
        # `latest` is left implicit: an explicit `--tag latest` turns off npm's
        # refusal to move latest to a lower version (a hand-tagged backport).
        run: |
          DIST_TAG=$(node "$GITHUB_WORKSPACE/packages/tapsmith/scripts/npm-dist-tag.mjs" "${GITHUB_REF_NAME#v}")
          echo "Publishing ${GITHUB_REF_NAME#v} under dist-tag '$DIST_TAG'."
          if [ "$DIST_TAG" = latest ]; then
            npm publish --access public
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Create GitHub Release with generated notes ───
  github-release:
    name: Create GitHub Release
    needs: [publish-tapsmith]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # fetch-depth: 0 so all tags are available for the notes-base computation.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
          else
            # Pin the notes base to the previous tag by semver order. Auto-detection
            # picks the base from git ancestry, which silently re-lists an earlier
            # release's changes when tags aren't linear ancestors.
            # versionsort.suffix=- sorts v0.6.0-beta.1 before v0.6.0 (git's default
            # puts it after). A prerelease's notes start at the tag before it; a
            # stable release's start at the previous stable one, so v0.6.0 lists
            # everything since v0.5.0 rather than since its last beta.
            if [[ "$TAG" == *-* ]]; then
              CANDIDATES=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname)
            else
              CANDIDATES=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | grep -v -e '-' || true)
            fi
            PREV=$(echo "$CANDIDATES" | awk -v cur="$TAG" '$0==cur{f=1;next} f{print;exit}')
            NOTES_ARGS=(--generate-notes)
            if [ -n "$PREV" ]; then
              NOTES_ARGS+=(--notes-start-tag "$PREV")
              echo "Generating notes from $PREV to $TAG."
            fi
            # A prerelease (v0.6.0-beta.1) is marked as one, so GitHub never
            # labels it the repo's Latest release (PILOT-541).
            if [[ "$TAG" == *-* ]]; then
              NOTES_ARGS+=(--prerelease)
            fi
            # Notes are grouped per .github/release.yml (read from the default branch).
            gh release create "$TAG" --title "$TAG" --verify-tag "${NOTES_ARGS[@]}"
          fi

      # Redeploy the website now that the Release exists, so its build-time
      # release fetch (sync-releases) picks up these notes. workflow_dispatch is
      # one of the few events the default GITHUB_TOKEN is allowed to trigger.
      - name: Redeploy website changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-website.yml --ref main

      # The promo video is a build artifact on the rolling `promo-video`
      # release, rendered by promo-video.yml. Re-render and republish it (which
      # redeploys the website again afterwards) only when its inputs changed
      # since the previous release. README and the docs-screenshot tooling live
      # in tools/promo too but do not affect the render.
      - name: Republish the promo video if it changed since the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The tag before this one, prereleases included: a beta that already
          # re-rendered the video makes a re-render for the stable release moot.
          PREV=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | awk -v cur="$TAG" '$0==cur{f=1;next} f{print;exit}')
          if [ -n "$PREV" ] && git diff --quiet "$PREV" "$TAG" -- tools/promo ':!tools/promo/README.md' ':!tools/promo/docs-shots'; then
            echo "tools/promo unchanged since $PREV; keeping the published video."
          else
            echo "tools/promo changed since ${PREV:-<no previous tag>}; re-rendering."
            gh workflow run promo-video.yml --ref main -f publish=true
            echo "Dispatched promo-video.yml (render + publish + website redeploy, ~30 min)."
          fi
