name: E2E iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual runs exist for the `Multi-device` job, which is disabled on push
  # and pull_request (see the job's comment).
  workflow_dispatch:

concurrency:
  group: e2e-ios-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Tapsmith's own CI is not a user; keep its runs out of the usage counts.
  TAPSMITH_TELEMETRY: "0"
  SHARD_TOTAL: 5
  # Cached login state for the `authenticated` project. Shards restore it
  # before the test step; ci-projects.mjs drops the `authentication` setup
  # project when the archive is present. Bump the -v suffix if the daemon's
  # app-state archive layout changes incompatibly.
  AUTH_STATE_ARCHIVE: e2e/tapsmith-results/auth-state-authentication.tar.gz
  AUTH_STATE_CACHE_VERSION: v1

jobs:
  # ─── Build prerequisites (parallel) ────────────────────────────────────

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dist/ is platform-independent (tsc output, proto copy, iOS agent
      # sources, vite web bundles), so build it once here instead of in each
      # of the shard jobs and the report job.
      - name: Cache SDK build
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: packages/tapsmith/dist
          key: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}

      - uses: actions/setup-node@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install and build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          retention-days: 1
          path: packages/tapsmith/dist/

  # Artifact downloads from the macOS runner pool are slow (44–155 s for the
  # 5 MB daemon, 14–76 s for the agent in the baseline run, vs 1–2 s on
  # ubuntu). Each build job therefore also publishes its output to
  # actions/cache, keyed on its inputs; shards restore from the cache first
  # and only fall back to the artifact on a miss. The keys below are repeated
  # verbatim in the shard job — keep them in sync.

  build-daemon:
    name: Build Daemon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Must run before the Cargo cache restores target/ — hashFiles ignores
      # .gitignore, so a populated target/ would poison the key.
      - name: Cache daemon binaries
        id: daemon-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ios-daemon-bin-${{ hashFiles('packages/tapsmith-core/**', 'proto/tapsmith.proto') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.daemon-cache.outputs.cache-hit != 'true'

      - name: Install protobuf compiler
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: brew install protobuf

      - name: Cache Cargo
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-core
        run: cargo build --release

      # Without the HID helper every HID-routed gesture silently downgrades
      # to the flaky XCTest agent path, so a daemon-only artifact must never
      # be published.
      - name: Verify HID helper was built
        run: test -x packages/tapsmith-core/target/release/tapsmith-ios-hid

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-binary-macos
          retention-days: 1
          # tapsmith-ios-hid rides along: the daemon resolves it as a sibling
          # binary and uses it for real-input touch injection (streamed drags,
          # double-tap on iOS 26 runtimes that coalesce synthesized taps).
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid

  build-agent:
    name: Build Agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # The xctestrun bundle is tied to the Xcode/SDK that produced it, so the
      # image's Xcode version is part of the key.
      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache agent build
        id: agent-cache
        uses: actions/cache@v4
        with:
          path: ios-agent/.build-sim
          key: ios-agent-build-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios-agent/**') }}

      - name: Generate Xcode project
        if: steps.agent-cache.outputs.cache-hit != 'true'
        working-directory: ios-agent
        run: |
          brew install xcodegen 2>/dev/null || true
          ./create-xcode-project.sh

      - name: Build for testing
        if: steps.agent-cache.outputs.cache-hit != 'true'
        working-directory: ios-agent
        run: |
          xcodebuild build-for-testing \
            -project TapsmithAgent.xcodeproj \
            -scheme TapsmithAgentUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-sim \
            -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: ios-agent-build
          retention-days: 1
          include-hidden-files: true
          path: ios-agent/.build-sim/

  build-test-app:
    name: Build Test App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache test app
        id: test-app-cache
        uses: actions/cache@v4
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: test-app-ios-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - uses: actions/setup-node@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - name: Build @tapsmith/react-native (test-app dependency)
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        env:
          # Release builds strip __DEV__; the flag keeps the in-app reset hooks on.
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        run: pod install

      - name: Build for iOS Simulator
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        env:
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          xcodebuild build \
            -workspace TapsmithTestApp.xcworkspace \
            -scheme TapsmithTestApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../.build \
            -quiet

      - name: Copy to fixtures path
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          cp -R test-app/.build/Build/Products/Release-iphonesimulator/TapsmithTestApp.app e2e/fixtures/

      - name: Package test app
        run: tar czf test-app-ios.tar.gz -C e2e/fixtures TapsmithTestApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: test-app-ios
          retention-days: 1
          path: test-app-ios.tar.gz

  # ─── Sharded E2E execution ─────────────────────────────────────────────

  e2e-test:
    name: "Shard ${{ matrix.shard }}/5"
    needs: [ build-sdk, build-daemon, build-agent, build-test-app ]
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      # Kick the boot off early and don't wait: the simulator reaches Booted
      # (~1-3 min on these runners) while the fetch/npm steps below run, and
      # has settled by the time "Wait for simulator boot" gates on it. The
      # boot does starve those steps meanwhile (a booting simulator eats the
      # runner) — but booting last instead just moves the same wait inside
      # `tapsmith test`'s setup phase and hands the SDK a still-settling
      # simulator, where `simctl list` takes 25-45 s per call. Measured
      # net-zero either way on shard time (PILOT-303), so keep the layout the
      # SDK is happiest with.
      - name: Select Xcode and start simulator boot
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # Same normalisation as build-agent's "Resolve Xcode version".
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ " | head -1 | xargs)
          echo "Using simulator: $SIM"
          echo "TAPSMITH_IOS_SIMULATOR=$SIM" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['name']=='$SIM' and dev['isAvailable']:
                print(dev['udid']); sys.exit()
          ")
          if [ -n "$UDID" ]; then
            echo "Booting $SIM ($UDID)"
            echo "TAPSMITH_IOS_UDID=$UDID" >> $GITHUB_ENV
            xcrun simctl boot "$UDID" 2>/dev/null || true
          fi

      # ─── Fetch build outputs: cache first, artifact on a miss ───
      # Keys mirror the build jobs' cache steps exactly (see the note above
      # build-daemon). The build jobs populate these caches in this same run,
      # so a miss here only happens if a save failed or was evicted.

      - name: Restore daemon binaries from cache
        id: daemon-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ios-daemon-bin-${{ hashFiles('packages/tapsmith-core/**', 'proto/tapsmith.proto') }}

      - name: Download daemon binary
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary-macos
          path: packages/tapsmith-core/target/release

      - name: Restore iOS agent from cache
        id: agent-cache
        uses: actions/cache/restore@v4
        with:
          path: ios-agent/.build-sim
          key: ios-agent-build-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios-agent/**') }}

      - name: Download iOS agent
        if: steps.agent-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-agent-build
          path: ios-agent/.build-sim

      - name: Restore test app from cache
        id: test-app-cache
        uses: actions/cache/restore@v4
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: test-app-ios-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - name: Download test app
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-app-ios
          path: .

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Restore SDK build from cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/tapsmith/dist
          key: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}

      - name: Download SDK build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=packages/tapsmith-core/target/release
          # download-artifact has been observed reporting success after a
          # partial extraction (tapsmith-core present, tapsmith-ios-hid
          # missing, no digest-verification lines in its log). Re-download
          # once before treating a missing binary as fatal.
          if [ ! -f "$REL/tapsmith-core" ] || [ ! -f "$REL/tapsmith-ios-hid" ]; then
            echo "daemon artifact incomplete; re-downloading"
            rm -f "$REL/tapsmith-core" "$REL/tapsmith-ios-hid"
            gh run download ${{ github.run_id }} -n daemon-binary-macos -D "$REL"
          fi
          chmod +x "$REL/tapsmith-core"
          xattr -d com.apple.quarantine "$REL/tapsmith-core" 2>/dev/null || true
          # Hard requirement, not best-effort: without the helper every
          # HID-routed gesture silently downgrades to the flaky agent path.
          chmod +x "$REL/tapsmith-ios-hid"
          xattr -d com.apple.quarantine "$REL/tapsmith-ios-hid" 2>/dev/null || true

      - name: Resolve xctestrun path
        run: |
          XCTESTRUN=$(find "$PWD/ios-agent/.build-sim" -name "*.xctestrun" -type f -print -quit)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No xctestrun found under ios-agent/.build-sim"
            exit 1
          fi
          echo "TAPSMITH_IOS_XCTESTRUN=$XCTESTRUN" >> $GITHUB_ENV
          echo "Resolved xctestrun: $XCTESTRUN"

      - name: Extract test app
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          tar xzf test-app-ios.tar.gz -C e2e/fixtures

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/cli.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # Exact-key match only: a stale login state for a different test-app
      # build must fall through to a fresh auth.setup run, never be reused.
      - name: Restore cached auth state
        id: auth-state-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AUTH_STATE_ARCHIVE }}
          key: auth-state-ios-${{ env.AUTH_STATE_CACHE_VERSION }}-${{
            hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js', 'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}-${{
            hashFiles('e2e/tests/auth.setup.ts', 'e2e/fixtures.ts', 'e2e/screens/**') }}

      - name: Wait for simulator boot
        run: |
          if [ -z "$TAPSMITH_IOS_UDID" ]; then
            echo "No simulator UDID resolved; skipping wait."
            exit 0
          fi
          # Wall-clock bounded, not tick-counted: each iteration shells out to
          # simctl AND python3, which on a loaded macOS runner costs far more
          # than the sleep — so "120" was a poll count that could idle for
          # several minutes. Nothing gates on the result (the state is only
          # echoed), so over-waiting was pure dead time before the shard ran.
          BOOT_DEADLINE=$(( $(date +%s) + 120 ))
          STATE=""
          while [ "$(date +%s)" -lt "$BOOT_DEADLINE" ]; do
            STATE=$(xcrun simctl list devices -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['udid']=='$TAPSMITH_IOS_UDID':
                print(dev['state']); sys.exit()
          ")
            if [ "$STATE" = "Booted" ]; then break; fi
            sleep 2
          done
          echo "Simulator state: $STATE"

      - name: Run E2E tests
        working-directory: e2e
        env:
          # Capture a per-shard timing breakdown (agent boot vs. per-command
          # device latency vs. app reset) for performance tracking. The daemon
          # appends one line per event when this var is set; it's a no-op
          # otherwise, so this adds only negligible file I/O.
          TAPSMITH_TIMING_LOG: ${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-${{ matrix.shard }}.log
        run: |
          npx tapsmith test -c tapsmith.config.ios-ci.mjs --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --workers 1

      # Only shards that ran auth.setup produce the archive (hashFiles is
      # empty otherwise), and only a green run may seed the cache. The
      # simulator's device-level keychain rides along in the archive under a
      # reserved member; the test app keeps its login in AsyncStorage, so drop
      # that member to keep the cached state independent of the simulator it
      # was captured on (restoreAppState skips the keychain swap when the
      # member is absent).
      - name: Prepare auth state for caching
        if: >-
          success() && steps.auth-state-cache.outputs.cache-hit != 'true'
          && hashFiles(env.AUTH_STATE_ARCHIVE) != ''
        run: |
          STAGE=$(mktemp -d)
          tar xzf "$AUTH_STATE_ARCHIVE" -C "$STAGE"
          rm -rf "$STAGE/.tapsmith-keychain"
          tar czf "$AUTH_STATE_ARCHIVE" -C "$STAGE" .
          echo "Cacheable auth state: $(du -h "$AUTH_STATE_ARCHIVE" | cut -f1)"

      - name: Save auth state to cache
        if: >-
          success() && steps.auth-state-cache.outputs.cache-hit != 'true'
          && hashFiles(env.AUTH_STATE_ARCHIVE) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AUTH_STATE_ARCHIVE }}
          key: ${{ steps.auth-state-cache.outputs.cache-primary-key }}

      # Record one trace against the live simulator and assert what is inside
      # it: decodable screenshots at the device's real resolution, hierarchy
      # dumps that contain the element each action resolved, and the app's real
      # HTTPS traffic. The sharded run above records `retain-on-failure`
      # traces nobody opens, so nothing else here would notice a trace that
      # packages successfully but holds the wrong data. One shard is enough —
      # this verifies the recording path, not the tests.
      - name: Verify trace archive contents
        if: matrix.shard == 1
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-${{ matrix.shard }}-trace.log
        run: node verify-trace-archive.mjs -c tapsmith.config.ios-ci.mjs

      - name: Summarize iOS timing breakdown
        if: always()
        run: |
          LOG="${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log"
          if [ ! -f "$LOG" ]; then
            echo "No timing log produced for shard ${{ matrix.shard }}."
            exit 0
          fi
          {
            echo "### iOS timing — shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            echo '```'
            echo "Boot / reset:"
            grep -E "kind=boot|kind=reset" "$LOG" || true
            echo
            echo "Per-command (count / total_ms / avg_ms), sorted by total:"
            grep "kind=cmd" "$LOG" \
              | sed -E 's/.*name=([a-zA-Z]+) dur_ms=([0-9]+).*/\1 \2/' \
              | awk '{c[$1]++; s[$1]+=$2}
                     END {for (k in c) printf "  %-16s n=%-5d total=%-8d avg=%.0f\n", k, c[k], s[k], s[k]/c[k]}' \
              | sort -t= -k3 -rn
            echo
            grep "kind=cmd" "$LOG" | sed -E 's/.*dur_ms=([0-9]+).*/\1/' \
              | awk '{s+=$1} END {printf "  Total command time: %d ms across %d commands\n", s, NR}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-timing-${{ matrix.shard }}
          retention-days: 7
          path: ${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log
          if-no-files-found: ignore

      - name: Print daemon deep-link diagnostics
        if: always()
        run: |
          found=0
          mkdir -p e2e/tapsmith-results
          for log in /tmp/tapsmith-daemon-ios-${{ matrix.shard }}*.log; do
            [ -e "$log" ] || continue
            found=1
            cp "$log" "e2e/tapsmith-results/$(basename "$log")"
            echo "::group::$(basename "$log") deep-link excerpts"
            grep -Ei "Open-in-app|openurl hit|Operation timed out opening URL|simctl openurl task failed|Failed to open URL" "$log" || true
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No daemon logs found."
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ios-${{ matrix.shard }}
          retention-days: 7
          path: e2e/blob-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios-${{ matrix.shard }}
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Two-device run (PILOT-310) ───────────────────────────────────────

  # A `use.devices` project drives two simulators per test. Its own job, not
  # a shard: the matrix boots one simulator per runner and a two-user test
  # halves the parallelism of whatever hosts it. The workflow boots the first
  # simulator exactly as a shard does; Tapsmith clones and boots the second
  # itself (`simulator` + provisioning), as it does on a developer machine.
  # DISABLED on push and pull_request: the standard 3-core macOS runner cannot
  # host two booted simulators at usable speed — with both up, the app install
  # takes minutes and XCUITest's own ~60 s launch of the app under test times
  # out before the agent can start (the same suite passes on Android's
  # 4-core KVM runner and on a developer Mac). Running it anyway spent an hour
  # of macOS runner time to report a failure nobody can act on, so it is now
  # manual-only (`workflow_dispatch`).
  #
  # To re-enable: give it a larger runner (`macos-latest-xlarge`), drop the
  # `if:` below and the test step's `continue-on-error`.
  e2e-multi-device:
    name: Multi-device
    needs: [ build-sdk, build-daemon, build-agent, build-test-app ]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      # Kick the boot off early and don't wait: the simulator reaches Booted
      # (~1-3 min on these runners) while the fetch/npm steps below run, and
      # has settled by the time "Wait for simulator boot" gates on it. The
      # boot does starve those steps meanwhile (a booting simulator eats the
      # runner) — but booting last instead just moves the same wait inside
      # `tapsmith test`'s setup phase and hands the SDK a still-settling
      # simulator, where `simctl list` takes 25-45 s per call. Measured
      # net-zero either way on shard time (PILOT-303), so keep the layout the
      # SDK is happiest with.
      - name: Select Xcode and start simulator boot
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # Same normalisation as build-agent's "Resolve Xcode version".
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ " | head -1 | xargs)
          echo "Using simulator: $SIM"
          echo "TAPSMITH_IOS_SIMULATOR=$SIM" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['name']=='$SIM' and dev['isAvailable']:
                print(dev['udid']); sys.exit()
          ")
          if [ -n "$UDID" ]; then
            echo "Booting $SIM ($UDID)"
            echo "TAPSMITH_IOS_UDID=$UDID" >> $GITHUB_ENV
            # The group's second member is a clone of the primary, which has to
            # be taken while the source is still shut down; it boots later (see
            # "Boot the second simulator").
            CLONE=$(xcrun simctl clone "$UDID" "$SIM")
            echo "Cloned $SIM -> $CLONE for the group's second device"
            echo "TAPSMITH_IOS_UDID2=$CLONE" >> $GITHUB_ENV
            xcrun simctl boot "$UDID" 2>/dev/null || true
          fi

      # ─── Fetch build outputs: cache first, artifact on a miss ───
      # Keys mirror the build jobs' cache steps exactly (see the note above
      # build-daemon). The build jobs populate these caches in this same run,
      # so a miss here only happens if a save failed or was evicted.

      - name: Restore daemon binaries from cache
        id: daemon-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ios-daemon-bin-${{ hashFiles('packages/tapsmith-core/**', 'proto/tapsmith.proto') }}

      - name: Download daemon binary
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary-macos
          path: packages/tapsmith-core/target/release

      - name: Restore iOS agent from cache
        id: agent-cache
        uses: actions/cache/restore@v4
        with:
          path: ios-agent/.build-sim
          key: ios-agent-build-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios-agent/**') }}

      - name: Download iOS agent
        if: steps.agent-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-agent-build
          path: ios-agent/.build-sim

      - name: Restore test app from cache
        id: test-app-cache
        uses: actions/cache/restore@v4
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: test-app-ios-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - name: Download test app
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-app-ios
          path: .

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Restore SDK build from cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/tapsmith/dist
          key: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}

      - name: Download SDK build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=packages/tapsmith-core/target/release
          # download-artifact has been observed reporting success after a
          # partial extraction (tapsmith-core present, tapsmith-ios-hid
          # missing, no digest-verification lines in its log). Re-download
          # once before treating a missing binary as fatal.
          if [ ! -f "$REL/tapsmith-core" ] || [ ! -f "$REL/tapsmith-ios-hid" ]; then
            echo "daemon artifact incomplete; re-downloading"
            rm -f "$REL/tapsmith-core" "$REL/tapsmith-ios-hid"
            gh run download ${{ github.run_id }} -n daemon-binary-macos -D "$REL"
          fi
          chmod +x "$REL/tapsmith-core"
          xattr -d com.apple.quarantine "$REL/tapsmith-core" 2>/dev/null || true
          # Hard requirement, not best-effort: without the helper every
          # HID-routed gesture silently downgrades to the flaky agent path.
          chmod +x "$REL/tapsmith-ios-hid"
          xattr -d com.apple.quarantine "$REL/tapsmith-ios-hid" 2>/dev/null || true

      - name: Resolve xctestrun path
        run: |
          XCTESTRUN=$(find "$PWD/ios-agent/.build-sim" -name "*.xctestrun" -type f -print -quit)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No xctestrun found under ios-agent/.build-sim"
            exit 1
          fi
          echo "TAPSMITH_IOS_XCTESTRUN=$XCTESTRUN" >> $GITHUB_ENV
          echo "Resolved xctestrun: $XCTESTRUN"

      # The clone the CI config pins as `bob` (TAPSMITH_IOS_UDID2) boots now so
      # it is warm before the tests start — cloning a cold one after the
      # primary was up took 5 min to boot and then outlasted the agent start
      # timeout on these 3-core runners. It boots after the cache restores on
      # purpose: two simulators booting during them starved `hashFiles()` past
      # its 120 s limit.
      - name: Boot the second simulator
        run: xcrun simctl boot "$TAPSMITH_IOS_UDID2" 2>/dev/null || true

      - name: Extract test app
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          tar xzf test-app-ios.tar.gz -C e2e/fixtures

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/cli.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Wait for both simulators to boot
        run: |
          if [ -z "$TAPSMITH_IOS_UDID" ]; then
            echo "No simulator UDID resolved; skipping wait."
            exit 0
          fi
          # `bootstatus -b` returns once the boot has actually finished
          # (SpringBoard, installd, launch services), not when the device
          # merely reports `Booted`: two simulators booting side by side left
          # the primary "Booted" but starved for minutes, and the app install
          # that followed timed out. Ten minutes covers both on these runners;
          # perl's alarm is the portable timeout (macOS has no coreutils).
          for UDID in "$TAPSMITH_IOS_UDID" "$TAPSMITH_IOS_UDID2"; do
            if perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl bootstatus "$UDID" -b; then
              echo "Simulator $UDID finished booting"
            else
              echo "::error::Simulator $UDID did not finish booting within 600s"
              exit 1
            fi
          done

      - name: Run two-device E2E tests
        id: two-device
        # Advisory on this runner size — see the job comment above. Kept so a
        # manual run still uploads its results instead of stopping at the
        # expected failure.
        continue-on-error: true
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-multi.log
        # Primary pinned with --device, member pinned through the CI config.
        run: npx tapsmith test -c tapsmith.config.ios-multi-ci.mjs --trace on --device "$TAPSMITH_IOS_UDID"

      - name: Report advisory outcome
        if: steps.two-device.outcome != 'success'
        run: echo "::warning::Two-device iOS suite did not pass on this runner (advisory — see the e2e-multi-device job comment)."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios-multi-device
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Merge shard reports ───────────────────────────────────────────────

  e2e-report:
    name: Merge Reports
    needs: [ build-sdk, e2e-test ]
    if: always() && needs.build-sdk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/cli.js

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-ios-*
          path: all-blob-reports
          merge-multiple: true

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Merge reports
        working-directory: e2e
        run: npx tapsmith merge-reports ../all-blob-reports -c
          tapsmith.config.ios-ci.mjs

      # always(): merge-reports exits 1 when a shard's blob is missing, but it
      # still writes the report for the shards that did finish.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-report
          retention-days: 30
          path: e2e/tapsmith-report/
