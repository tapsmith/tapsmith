name: E2E iOS

# macOS runners are the scarce resource: the org gets 5 concurrent macOS jobs
# across every workflow, and each run of this one needs up to 3 of them for
# builds plus one per shard. So it runs only where it can find something:
#
# - Not on draft PRs. The `gate` job skips the whole run for a draft, and
#   `ready_for_review` starts it when the PR is marked ready. Drafts are where
#   most pushes land, and each one used to start a run the next push cancelled.
# - Not on changes that cannot reach an iOS run. The `paths` lists below
#   (keep the two in sync) include everything, then exclude docs, the website,
#   the Android agent and Android-only e2e files, other tooling, and other
#   workflows. A later positive pattern re-includes a path.
on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!website/**'
      - '!agent/**'
      - '!tools/**'
      - '!web-tests/**'
      - '!npm-packages/**'
      - '!.claude/**'
      - '!.agents/**'
      - '!LICENSE'
      - '!DCO'
      - '!e2e/**/*.android.test.ts'
      - '!e2e/tapsmith.config.android*.mjs'
      - '!.github/**'
      - '.github/workflows/e2e-ios.yml'
  # Every PR, whatever its base (stacked PRs; see ci.yml).
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!website/**'
      - '!agent/**'
      - '!tools/**'
      - '!web-tests/**'
      - '!npm-packages/**'
      - '!.claude/**'
      - '!.agents/**'
      - '!LICENSE'
      - '!DCO'
      - '!e2e/**/*.android.test.ts'
      - '!e2e/tapsmith.config.android*.mjs'
      - '!.github/**'
      - '.github/workflows/e2e-ios.yml'
  # Manual runs exist for the `Multi-device` job, which is disabled on push
  # and pull_request (see the job's comment).
  workflow_dispatch:

# A PR's runs share its branch; pushes to main share refs/heads/main, so a
# burst of merges finishes only the newest main run instead of one per merge.
concurrency:
  group: e2e-ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Tapsmith's own CI is not a user; keep its runs out of the usage counts.
  TAPSMITH_TELEMETRY: "0"
  # Simulator taps, double taps and long presses go through the daemon's
  # tapsmith-ios-hid helper. When the helper can't start (or the agent build
  # predates HID taps) they quietly fall back to the agent's slower XCTest
  # touches; this makes that fail the run instead, so the suite proves the
  # helper works. Taps the agent chooses to make itself (an XPath selector,
  # a rotated screen it can't map) are not failed by it.
  TAPSMITH_REQUIRE_IOS_HID: "1"
  # Fixed per-shard overhead (cache restores, simulator boot, app install,
  # agent start) is ~10 of a shard's ~20 min, so fewer shards spend fewer
  # macOS runner-minutes per run. Keep the matrix and the job name in sync.
  SHARD_TOTAL: 3
  # Cached login state for the `authenticated` project. Shards restore it
  # before the test step; ci-projects.mjs drops the `authentication` setup
  # project when the archive is present. Bump the -v suffix if the daemon's
  # app-state archive layout changes incompatibly.
  AUTH_STATE_ARCHIVE: e2e/tapsmith-results/auth-state-authentication.tar.gz
  AUTH_STATE_CACHE_VERSION: v1

jobs:
  # ─── Gate ──────────────────────────────────────────────────────────────

  # Every other job needs this one, so skipping it (a draft PR) skips the run.
  #
  # It also computes every cache key that hashes a source tree, once, and
  # hands them to the other jobs as outputs. On a shard, hashFiles() runs
  # while the simulator boots and starves the 3-core runner: hashing
  # packages/tapsmith-core took 54-68 s there (and was billed to the cache
  # step) against under a second here (PILOT-1133). The keys also stay in one
  # place instead of being repeated in every job.
  #
  # And it checks, from an ubuntu runner, whether each macOS build job's
  # output is already cached. A build job whose output is cached would only
  # restore and re-upload it, but it still has to wait for one of the 5 macOS
  # slots first — which took up to 54 min on a busy day, before the shards
  # queued a second time. The caches restore across Linux and macOS, so this
  # lookup sees exactly what the shards will restore.
  gate:
    name: Gate
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      daemon-key: ${{ steps.keys.outputs.daemon }}
      # The agent key ends in the Xcode version and host arch, which only a
      # macOS runner can read, so this is the sources' prefix; each macOS job
      # appends its own suffix (see "Resolve Xcode version").
      agent-key-prefix: ${{ steps.keys.outputs.agent-prefix }}
      test-app-key: ${{ steps.keys.outputs.test-app }}
      sdk-key: ${{ steps.keys.outputs.sdk }}
      auth-state-key: ${{ steps.keys.outputs.auth-state }}
      daemon-cached: ${{ steps.daemon.outputs.cache-hit == 'true' }}
      # Matched on the prefix: some Xcode's build of these sources is cached.
      # A shard whose Xcode has no build of its own builds the agent itself
      # (see the shard's "Build iOS agent").
      agent-cached: ${{ steps.agent.outputs.cache-matched-key != '' }}
      test-app-cached: ${{ steps.test-app.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The sdk-dist and ios-daemon-bin keys are shared with the other E2E
      # workflows' caches; keep those expressions identical to theirs.
      # The agent cache holds only Build/Products of an arm64-only build; the
      # `products` prefix replaced the whole-DerivedData `ios-agent-build-`
      # entries (81 MB → under 2 MB, PILOT-1133).
      - name: Compute cache keys
        id: keys
        env:
          DAEMON: ios-daemon-bin-${{ hashFiles('packages/tapsmith-core/**', 'proto/tapsmith.proto') }}
          AGENT_PREFIX: ios-agent-products-${{ hashFiles('ios-agent/**') }}-
          TEST_APP: test-app-ios-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}
          SDK: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}
          # Exact-key match only (see the shard's "Restore cached auth state").
          AUTH_STATE: auth-state-ios-${{ env.AUTH_STATE_CACHE_VERSION }}-${{
            hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js', 'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}-${{
            hashFiles('e2e/tests/auth.setup.ts', 'e2e/fixtures.ts', 'e2e/screens/**') }}
        run: |
          {
            echo "daemon=$DAEMON"
            echo "agent-prefix=$AGENT_PREFIX"
            echo "test-app=$TEST_APP"
            echo "sdk=$SDK"
            echo "auth-state=$AUTH_STATE"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Look up daemon binaries
        id: daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: true
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ${{ steps.keys.outputs.daemon }}

      - name: Look up iOS agent build
        id: agent
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: true
          path: ios-agent/.build-sim/Build/Products
          key: ${{ steps.keys.outputs.agent-prefix }}
          restore-keys: ${{ steps.keys.outputs.agent-prefix }}

      - name: Look up test app
        id: test-app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: true
          path: e2e/fixtures/TapsmithTestApp.app
          key: ${{ steps.keys.outputs.test-app }}

  # ─── Build prerequisites (parallel) ────────────────────────────────────

  build-sdk:
    name: Build SDK
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # dist/ is platform-independent (tsc output, proto copy, iOS agent
      # sources, vite web bundles), so build it once here instead of in each
      # of the shard jobs and the report job.
      - name: Cache SDK build
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/tapsmith/dist
          key: ${{ needs.gate.outputs.sdk-key }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install and build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith
        run: npm ci && npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-dist
          # Outlives a next-day `--failed` re-run, whose Merge Reports needs it.
          retention-days: 7
          path: packages/tapsmith/dist/

  # Artifact downloads from the macOS runner pool are slow (44–155 s for the
  # 5 MB daemon, 14–76 s for the agent in the baseline run, vs 1–2 s on
  # ubuntu). Each build job therefore also publishes its output to
  # actions/cache, keyed on its inputs; shards restore from the cache first
  # and only fall back to the artifact on a miss. Every job reads the keys
  # from the gate's outputs.

  build-daemon:
    name: Build Daemon
    needs: gate
    if: needs.gate.outputs.daemon-cached != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache daemon binaries
        id: daemon-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ${{ needs.gate.outputs.daemon-key }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.daemon-cache.outputs.cache-hit != 'true'

      - name: Install protobuf compiler
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: brew install protobuf

      - name: Cache Cargo
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-core
        run: cargo build --release

      # Without the HID helper every HID-routed gesture silently downgrades
      # to the flaky XCTest agent path, so a daemon-only artifact must never
      # be published.
      - name: Verify HID helper was built
        run: test -x packages/tapsmith-core/target/release/tapsmith-ios-hid

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-binary-macos
          retention-days: 1
          # tapsmith-ios-hid rides along: the daemon resolves it as a sibling
          # binary and uses it for real-input touch injection (streamed drags,
          # double-tap on iOS 26 runtimes that coalesce synthesized taps).
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid

  build-agent:
    name: Build Agent
    needs: gate
    if: needs.gate.outputs.agent-cached != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # The xctestrun bundle is tied to the Xcode/SDK that produced it, and the
      # build holds only the runner's own arch, so both are part of the key —
      # last, so the gate (which cannot read them) can match the sources'
      # prefix.
      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')-$(uname -m)" >> "$GITHUB_OUTPUT"

      # Only Build/Products: the .xctestrun and the bundles it names
      # (__TESTROOT__-relative), which is all a shard reads. The rest of the
      # DerivedData (intermediates, index, module cache) was 96% of the old
      # 81 MB entry.
      - name: Cache agent build
        id: agent-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios-agent/.build-sim/Build/Products
          key: ${{ needs.gate.outputs.agent-key-prefix }}${{ steps.xcode.outputs.version }}

      - name: Generate Xcode project
        if: steps.agent-cache.outputs.cache-hit != 'true'
        working-directory: ios-agent
        run: |
          brew install xcodegen 2>/dev/null || true
          ./create-xcode-project.sh

      - name: Build for testing
        if: steps.agent-cache.outputs.cache-hit != 'true'
        working-directory: ios-agent
        run: |
          # The runner's arch only, as the SDK's own simulator build does:
          # a universal build doubles the binaries for an arch no runner uses.
          xcodebuild build-for-testing \
            -project TapsmithAgent.xcodeproj \
            -scheme TapsmithAgentUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-sim \
            -quiet \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-agent-build
          retention-days: 1
          include-hidden-files: true
          path: ios-agent/.build-sim/Build/Products/

  build-test-app:
    name: Build Test App
    needs: gate
    if: needs.gate.outputs.test-app-cached != 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache test app
        id: test-app-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: ${{ needs.gate.outputs.test-app-key }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - name: Build @tapsmith/react-native (test-app dependency)
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        env:
          # Release builds strip __DEV__; the flag keeps the in-app reset hooks on.
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        run: pod install

      - name: Build for iOS Simulator
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        env:
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          xcodebuild build \
            -workspace TapsmithTestApp.xcworkspace \
            -scheme TapsmithTestApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../.build \
            -quiet

      - name: Copy to fixtures path
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          cp -R test-app/.build/Build/Products/Release-iphonesimulator/TapsmithTestApp.app e2e/fixtures/

      - name: Package test app
        run: tar czf test-app-ios.tar.gz -C e2e/fixtures TapsmithTestApp.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-app-ios
          retention-days: 1
          path: test-app-ios.tar.gz

  # ─── Sharded E2E execution ─────────────────────────────────────────────

  e2e-test:
    name: "Shard ${{ matrix.shard }}/3"
    needs: [ gate, build-sdk, build-daemon, build-agent, build-test-app ]
    # The gate skips a build job whose output is already cached; a skipped
    # need would otherwise skip this job too.
    if: >-
      !cancelled() && needs.build-sdk.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build-daemon.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-agent.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-test-app.result)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      # Kick the boot off early and don't wait: the simulator reaches Booted
      # (~1-3 min on these runners) while the fetch/npm steps below run, and
      # has settled by the time "Wait for simulator boot" gates on it. The
      # boot does starve those steps meanwhile (a booting simulator eats the
      # runner) — but booting last instead just moves the same wait inside
      # `tapsmith test`'s setup phase and hands the SDK a still-settling
      # simulator, where `simctl list` takes 25-45 s per call. Measured
      # net-zero either way on shard time (PILOT-303), so keep the layout the
      # SDK is happiest with.
      # Keep the simulator off Apple's MobileAsset catalog servers. On each
      # boot mobileassetd fetches trustd's PKITrustSupplementals update; when
      # it lands (8-15 min after boot, depending on Apple's servers) trustd
      # applies a pinning-database update and answers no certificate check,
      # from any process, for ~2 min. A test whose HTTPS request falls in that
      # window times out (seen on api-request-fixture's first attempt). With
      # the catalog hosts unreachable the update never starts. The simulator
      # resolves through the host, so /etc/hosts covers it.
      - name: Block the simulator's MobileAsset catalog hosts
        run: |
          printf '0.0.0.0 mesu.apple.com\n0.0.0.0 gdmf.apple.com\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true

      - name: Select Xcode and start simulator boot
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # Same normalisation as build-agent's "Resolve Xcode version".
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')-$(uname -m)" >> "$GITHUB_OUTPUT"
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ " | head -1 | xargs)
          echo "Using simulator: $SIM"
          echo "TAPSMITH_IOS_SIMULATOR=$SIM" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['name']=='$SIM' and dev['isAvailable']:
                print(dev['udid']); sys.exit()
          ")
          if [ -n "$UDID" ]; then
            echo "Booting $SIM ($UDID)"
            echo "TAPSMITH_IOS_UDID=$UDID" >> $GITHUB_ENV
            xcrun simctl boot "$UDID" 2>/dev/null || true
          fi

      # ─── Fetch build outputs: cache first, artifact on a miss ───
      # The keys are the gate's, as the build jobs use them (see the note
      # above build-daemon). A build job that ran populated its cache in this
      # same run, and the gate skips one only when its output is already
      # cached, so a miss here means a save failed, the entry was evicted after
      # the gate looked, or (the agent only) this runner's Xcode or arch has no
      # build yet.

      - name: Restore daemon binaries from cache
        id: daemon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ${{ needs.gate.outputs.daemon-key }}

      - name: Download daemon binary
        if: steps.daemon-cache.outputs.cache-hit != 'true' && needs.build-daemon.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: daemon-binary-macos
          path: packages/tapsmith-core/target/release

      - name: Restore iOS agent from cache
        id: agent-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios-agent/.build-sim/Build/Products
          key: ${{ needs.gate.outputs.agent-key-prefix }}${{ steps.xcode.outputs.version }}

      - name: Download iOS agent
        if: steps.agent-cache.outputs.cache-hit != 'true' && needs.build-agent.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-agent-build
          path: ios-agent/.build-sim/Build/Products

      # The gate skipped build-agent because a build of these sources is
      # cached for some Xcode, but not for this runner's (a new runner image).
      # Build it here, as build-agent does, and cache it for the next run.
      - name: Build iOS agent for this Xcode
        if: steps.agent-cache.outputs.cache-hit != 'true' && needs.build-agent.result != 'success'
        working-directory: ios-agent
        run: |
          brew install xcodegen 2>/dev/null || true
          ./create-xcode-project.sh
          # The runner's arch only, as the SDK's own simulator build does:
          # a universal build doubles the binaries for an arch no runner uses.
          xcodebuild build-for-testing \
            -project TapsmithAgent.xcodeproj \
            -scheme TapsmithAgentUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-sim \
            -quiet \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO

      # Concurrent shards race to save the same key; the losers only warn.
      - name: Save iOS agent build to cache
        if: steps.agent-cache.outputs.cache-hit != 'true' && needs.build-agent.result != 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios-agent/.build-sim/Build/Products
          key: ${{ steps.agent-cache.outputs.cache-primary-key }}

      - name: Restore test app from cache
        id: test-app-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: ${{ needs.gate.outputs.test-app-key }}

      - name: Download test app
        if: steps.test-app-cache.outputs.cache-hit != 'true' && needs.build-test-app.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-app-ios
          path: .

      - name: Fail if a skipped build's cache entry is gone
        if: >-
          (steps.daemon-cache.outputs.cache-hit != 'true' && needs.build-daemon.result != 'success')
          || (steps.test-app-cache.outputs.cache-hit != 'true' && needs.build-test-app.result != 'success')
        run: |
          echo "::error::The gate skipped a build because its output was cached, but the cache entry was gone when this job restored it (the repo's Actions cache evicts least-recently-used entries past its size limit). Use 'Re-run all jobs': 'Re-run failed jobs' keeps the gate's old answer."
          exit 1

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Restore SDK build from cache
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/tapsmith/dist
          key: ${{ needs.gate.outputs.sdk-key }}

      - name: Download SDK build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=packages/tapsmith-core/target/release
          # download-artifact has been observed reporting success after a
          # partial extraction (tapsmith-core present, tapsmith-ios-hid
          # missing, no digest-verification lines in its log). Re-download
          # once before treating a missing binary as fatal.
          if [ ! -f "$REL/tapsmith-core" ] || [ ! -f "$REL/tapsmith-ios-hid" ]; then
            echo "daemon artifact incomplete; re-downloading"
            rm -f "$REL/tapsmith-core" "$REL/tapsmith-ios-hid"
            gh run download ${{ github.run_id }} -n daemon-binary-macos -D "$REL"
          fi
          chmod +x "$REL/tapsmith-core"
          xattr -d com.apple.quarantine "$REL/tapsmith-core" 2>/dev/null || true
          # Hard requirement, not best-effort: without the helper every
          # HID-routed gesture silently downgrades to the flaky agent path.
          chmod +x "$REL/tapsmith-ios-hid"
          xattr -d com.apple.quarantine "$REL/tapsmith-ios-hid" 2>/dev/null || true

      - name: Resolve xctestrun path
        run: |
          XCTESTRUN=$(find "$PWD/ios-agent/.build-sim" -name "*.xctestrun" -type f -print -quit)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No xctestrun found under ios-agent/.build-sim"
            exit 1
          fi
          echo "TAPSMITH_IOS_XCTESTRUN=$XCTESTRUN" >> $GITHUB_ENV
          echo "Resolved xctestrun: $XCTESTRUN"

      - name: Extract test app
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          tar xzf test-app-ios.tar.gz -C e2e/fixtures

      # Production dependencies only: the job runs the prebuilt dist, which
      # (as published) needs nothing from devDependencies — 172 packages
      # instead of 387, and 2-3 min less inside the simulator boot's starved
      # window (PILOT-1133).
      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci --omit=dev

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/bin.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # Exact-key match only: a stale login state for a different test-app
      # build must fall through to a fresh auth.setup run, never be reused.
      - name: Restore cached auth state
        id: auth-state-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.AUTH_STATE_ARCHIVE }}
          key: ${{ needs.gate.outputs.auth-state-key }}

      - name: Wait for simulator boot
        run: |
          if [ -z "$TAPSMITH_IOS_UDID" ]; then
            echo "No simulator UDID resolved; skipping wait."
            exit 0
          fi
          # Wall-clock bounded, not tick-counted: each iteration shells out to
          # simctl AND python3, which on a loaded macOS runner costs far more
          # than the sleep — so "120" was a poll count that could idle for
          # several minutes. Nothing gates on the result (the state is only
          # echoed), so over-waiting was pure dead time before the shard ran.
          BOOT_DEADLINE=$(( $(date +%s) + 120 ))
          STATE=""
          while [ "$(date +%s)" -lt "$BOOT_DEADLINE" ]; do
            STATE=$(xcrun simctl list devices -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['udid']=='$TAPSMITH_IOS_UDID':
                print(dev['state']); sys.exit()
          ")
            if [ "$STATE" = "Booted" ]; then break; fi
            sleep 2
          done
          echo "Simulator state: $STATE"

      - name: Run E2E tests
        working-directory: e2e
        env:
          # Capture a per-shard timing breakdown (agent boot vs. per-command
          # device latency vs. app reset) for performance tracking. The daemon
          # appends one line per event when this var is set; it's a no-op
          # otherwise, so this adds only negligible file I/O.
          TAPSMITH_TIMING_LOG: ${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-${{ matrix.shard }}.log
        run: |
          npx tapsmith test -c tapsmith.config.ios-ci.mjs --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --workers 1

      # PILOT-462: the first tapsmith_snapshot of a headless MCP session must
      # return the screen after the app's data was cleared and the simulator
      # rebooted. A clearData that orphaned the app container used to leave
      # the first launch after every boot without accessibility, so MCP's
      # first device tool failed with XCUITest's "Interrupting test" while
      # `tapsmith test` (which relaunches the app per test) never noticed.
      # The script replays install → clear_data → reboot → reboot → first
      # snapshot. One shard is enough. It runs after the tests (its reboots
      # must not land mid-shard) and even when they failed, so a failure in
      # either one never hides the other.
      #
      # It costs ~9 min on these runners, so a pull request runs it only when
      # it touches the code it guards (the list and the decision are in
      # e2e/utils/mcp-first-snapshot-paths.mjs, unit-tested). Push to main and
      # manual runs always run it, as does a PR whose diff can't be listed.
      - name: Decide whether to verify the first MCP snapshot
        id: mcp-snapshot-gate
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: e2e
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node utils/mcp-first-snapshot-paths.mjs

      - name: Verify first MCP snapshot after clearData and reboots
        if: ${{ !cancelled() && matrix.shard == 2 && steps.mcp-snapshot-gate.outputs.run == 'true' }}
        working-directory: e2e
        # ~9 min healthy. The headroom lets a simulator reboot that hangs be
        # recovered, or fail naming the stuck simctl call, before this kills
        # it (PILOT-708; e2e/utils/simulator-reboot.mjs, whose test checks
        # its worst case against this value).
        timeout-minutes: 20
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-${{ matrix.shard }}-mcp.log
        run: node verify-mcp-first-snapshot.mjs -c tapsmith.config.ios-ci.mjs --udid "$TAPSMITH_IOS_UDID" --app ./fixtures/TapsmithTestApp.app

      # Only shards that ran auth.setup produce the archive (hashFiles is
      # empty otherwise), and only a green run may seed the cache. The
      # simulator's device-level keychain rides along in the archive under a
      # reserved member; the test app keeps its login in AsyncStorage, so drop
      # that member to keep the cached state independent of the simulator it
      # was captured on (restoreAppState skips the keychain swap when the
      # member is absent).
      - name: Prepare auth state for caching
        if: >-
          success() && steps.auth-state-cache.outputs.cache-hit != 'true'
          && hashFiles(env.AUTH_STATE_ARCHIVE) != ''
        run: |
          STAGE=$(mktemp -d)
          tar xzf "$AUTH_STATE_ARCHIVE" -C "$STAGE"
          rm -rf "$STAGE/.tapsmith-keychain"
          tar czf "$AUTH_STATE_ARCHIVE" -C "$STAGE" .
          echo "Cacheable auth state: $(du -h "$AUTH_STATE_ARCHIVE" | cut -f1)"

      - name: Save auth state to cache
        if: >-
          success() && steps.auth-state-cache.outputs.cache-hit != 'true'
          && hashFiles(env.AUTH_STATE_ARCHIVE) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.AUTH_STATE_ARCHIVE }}
          key: ${{ steps.auth-state-cache.outputs.cache-primary-key }}

      # Record one trace against the live simulator and assert what is inside
      # it: decodable screenshots at the device's real resolution, hierarchy
      # dumps that contain the element each action resolved, and the app's real
      # HTTPS traffic. The sharded run above traces only retries
      # (`on-all-retries`), so nothing else here would notice a trace that
      # packages successfully but holds the wrong data. One shard is enough —
      # this verifies the recording path, not the tests.
      - name: Verify trace archive contents
        if: matrix.shard == 1
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-${{ matrix.shard }}-trace.log
        run: node verify-trace-archive.mjs -c tapsmith.config.ios-ci.mjs

      - name: Summarize iOS timing breakdown
        if: always()
        run: |
          LOG="${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log"
          if [ ! -f "$LOG" ]; then
            echo "No timing log produced for shard ${{ matrix.shard }}."
            exit 0
          fi
          {
            echo "### iOS timing — shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            echo '```'
            echo "Boot / reset / app state (save, restore, clear):"
            grep -E "kind=boot|kind=reset|kind=appstate" "$LOG" || true
            echo
            echo "Per-command (count / total_ms / avg_ms), sorted by total:"
            grep "kind=cmd" "$LOG" \
              | sed -E 's/.*name=([a-zA-Z]+) dur_ms=([0-9]+).*/\1 \2/' \
              | awk '{c[$1]++; s[$1]+=$2}
                     END {for (k in c) printf "  %-16s n=%-5d total=%-8d avg=%.0f\n", k, c[k], s[k], s[k]/c[k]}' \
              | sort -t= -k3 -rn
            echo
            grep "kind=cmd" "$LOG" | sed -E 's/.*dur_ms=([0-9]+).*/\1/' \
              | awk '{s+=$1} END {printf "  Total command time: %d ms across %d commands\n", s, NR}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-timing-${{ matrix.shard }}
          retention-days: 7
          path: ${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log
          if-no-files-found: ignore

      - name: Print daemon deep-link diagnostics
        if: always()
        run: |
          found=0
          mkdir -p e2e/tapsmith-results
          for log in /tmp/tapsmith-daemon-ios-${{ matrix.shard }}*.log; do
            [ -e "$log" ] || continue
            found=1
            cp "$log" "e2e/tapsmith-results/$(basename "$log")"
            echo "::group::$(basename "$log") deep-link excerpts"
            grep -Ei "Open-in-app|openurl hit|Operation timed out opening URL|simctl openurl task failed|Failed to open URL" "$log" || true
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No daemon logs found."
          fi

      # A request the app sends can hang in the simulator's certificate
      # check (trust evaluation handed to trustd, no answer): the trace shows
      # the app's side only. Keep the simulator's own trustd/securityd log,
      # with the app's network log beside it, so the other side can be read
      # too: on a failed run, and always on shard 1, where a test that fails
      # and then passes on retry leaves the job green. Known cause so far:
      # trustd updating its pinning database from a freshly downloaded
      # PKITrustSupplementals asset blocks every evaluation for ~1.5-2.5 min,
      # some 8-15 min after boot (mobileassetd is logged for the download).
      # The /etc/hosts step before boot now blocks that download; this log
      # shows whether it still happens (a "should update" line from trustd).
      - name: Collect simulator trust logs
        if: ${{ !cancelled() && env.TAPSMITH_IOS_UDID != '' && (failure() || matrix.shard == 1) }}
        timeout-minutes: 5
        run: |
          mkdir -p e2e/tapsmith-results
          out="e2e/tapsmith-results/simulator-trust-${{ matrix.shard }}.log"
          {
            echo "== launchctl (trustd)"
            xcrun simctl spawn "$TAPSMITH_IOS_UDID" launchctl list 2>&1 | grep -i trust || true
            echo "== log show"
            xcrun simctl spawn "$TAPSMITH_IOS_UDID" log show --last 90m --style compact --info --debug \
              --predicate 'process == "trustd" OR process == "securityd" OR process == "mobileassetd" OR subsystem == "com.apple.securityd" OR subsystem == "com.apple.trustd" OR (process == "TapsmithTestApp" AND (subsystem == "com.apple.network" OR subsystem == "com.apple.CFNetwork" OR subsystem BEGINSWITH "com.apple.security"))' 2>&1 || true
          } > "$out"
          echo "$(wc -l < "$out") lines in $out"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blob-report-ios-${{ matrix.shard }}
          retention-days: 7
          path: e2e/blob-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-ios-${{ matrix.shard }}
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Two-device run (PILOT-310) ───────────────────────────────────────

  # A `use.devices` project drives two simulators per test. Its own job, not
  # a shard: the matrix boots one simulator per runner and a two-user test
  # halves the parallelism of whatever hosts it. The workflow boots the first
  # simulator exactly as a shard does; Tapsmith clones and boots the second
  # itself (`simulator` + provisioning), as it does on a developer machine.
  # DISABLED on push and pull_request: the standard 3-core macOS runner cannot
  # host two booted simulators at usable speed — with both up, the app install
  # takes minutes and XCUITest's own ~60 s launch of the app under test times
  # out before the agent can start (the same suite passes on Android's
  # 4-core KVM runner and on a developer Mac). Running it anyway spent an hour
  # of macOS runner time to report a failure nobody can act on, so it is now
  # manual-only (`workflow_dispatch`).
  #
  # To re-enable: give it a larger runner (`macos-latest-xlarge`), drop the
  # `workflow_dispatch` clause from the `if:` below and the test step's
  # `continue-on-error`.
  e2e-multi-device:
    name: Multi-device
    needs: [ gate, build-sdk, build-daemon, build-agent, build-test-app ]
    # Skipped builds are fine here too (see e2e-test).
    if: >-
      !cancelled() && needs.build-sdk.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build-daemon.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-agent.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-test-app.result)
      && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      # Kick the boot off early and don't wait: the simulator reaches Booted
      # (~1-3 min on these runners) while the fetch/npm steps below run, and
      # has settled by the time "Wait for simulator boot" gates on it. The
      # boot does starve those steps meanwhile (a booting simulator eats the
      # runner) — but booting last instead just moves the same wait inside
      # `tapsmith test`'s setup phase and hands the SDK a still-settling
      # simulator, where `simctl list` takes 25-45 s per call. Measured
      # net-zero either way on shard time (PILOT-303), so keep the layout the
      # SDK is happiest with.
      # Keep the simulator off Apple's MobileAsset catalog servers. On each
      # boot mobileassetd fetches trustd's PKITrustSupplementals update; when
      # it lands (8-15 min after boot, depending on Apple's servers) trustd
      # applies a pinning-database update and answers no certificate check,
      # from any process, for ~2 min. A test whose HTTPS request falls in that
      # window times out (seen on api-request-fixture's first attempt). With
      # the catalog hosts unreachable the update never starts. The simulator
      # resolves through the host, so /etc/hosts covers it.
      - name: Block the simulator's MobileAsset catalog hosts
        run: |
          printf '0.0.0.0 mesu.apple.com\n0.0.0.0 gdmf.apple.com\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true

      - name: Select Xcode and start simulator boot
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # Same normalisation as build-agent's "Resolve Xcode version".
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')-$(uname -m)" >> "$GITHUB_OUTPUT"
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ " | head -1 | xargs)
          echo "Using simulator: $SIM"
          echo "TAPSMITH_IOS_SIMULATOR=$SIM" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['name']=='$SIM' and dev['isAvailable']:
                print(dev['udid']); sys.exit()
          ")
          if [ -n "$UDID" ]; then
            echo "Booting $SIM ($UDID)"
            echo "TAPSMITH_IOS_UDID=$UDID" >> $GITHUB_ENV
            # The group's second member is a clone of the primary, which has to
            # be taken while the source is still shut down; it boots later (see
            # "Boot the second simulator").
            CLONE=$(xcrun simctl clone "$UDID" "$SIM")
            echo "Cloned $SIM -> $CLONE for the group's second device"
            echo "TAPSMITH_IOS_UDID2=$CLONE" >> $GITHUB_ENV
            xcrun simctl boot "$UDID" 2>/dev/null || true
          fi

      # ─── Fetch build outputs: cache first, artifact on a miss ───
      # The keys are the gate's, as the build jobs use them (see the note
      # above build-daemon). A build job that ran populated its cache in this
      # same run, and the gate skips one only when its output is already
      # cached, so a miss here means a save failed, the entry was evicted after
      # the gate looked, or (the agent only) this runner's Xcode or arch has no
      # build yet.

      - name: Restore daemon binaries from cache
        id: daemon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ${{ needs.gate.outputs.daemon-key }}

      - name: Download daemon binary
        if: steps.daemon-cache.outputs.cache-hit != 'true' && needs.build-daemon.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: daemon-binary-macos
          path: packages/tapsmith-core/target/release

      - name: Restore iOS agent from cache
        id: agent-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios-agent/.build-sim/Build/Products
          key: ${{ needs.gate.outputs.agent-key-prefix }}${{ steps.xcode.outputs.version }}

      - name: Download iOS agent
        if: steps.agent-cache.outputs.cache-hit != 'true' && needs.build-agent.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-agent-build
          path: ios-agent/.build-sim/Build/Products

      # The gate skipped build-agent because a build of these sources is
      # cached for some Xcode, but not for this runner's (a new runner image).
      # Build it here, as build-agent does, and cache it for the next run.
      - name: Build iOS agent for this Xcode
        if: steps.agent-cache.outputs.cache-hit != 'true' && needs.build-agent.result != 'success'
        working-directory: ios-agent
        run: |
          brew install xcodegen 2>/dev/null || true
          ./create-xcode-project.sh
          # The runner's arch only, as the SDK's own simulator build does:
          # a universal build doubles the binaries for an arch no runner uses.
          xcodebuild build-for-testing \
            -project TapsmithAgent.xcodeproj \
            -scheme TapsmithAgentUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-sim \
            -quiet \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO

      # Concurrent shards race to save the same key; the losers only warn.
      - name: Save iOS agent build to cache
        if: steps.agent-cache.outputs.cache-hit != 'true' && needs.build-agent.result != 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios-agent/.build-sim/Build/Products
          key: ${{ steps.agent-cache.outputs.cache-primary-key }}

      - name: Restore test app from cache
        id: test-app-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: ${{ needs.gate.outputs.test-app-key }}

      - name: Download test app
        if: steps.test-app-cache.outputs.cache-hit != 'true' && needs.build-test-app.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-app-ios
          path: .

      - name: Fail if a skipped build's cache entry is gone
        if: >-
          (steps.daemon-cache.outputs.cache-hit != 'true' && needs.build-daemon.result != 'success')
          || (steps.test-app-cache.outputs.cache-hit != 'true' && needs.build-test-app.result != 'success')
        run: |
          echo "::error::The gate skipped a build because its output was cached, but the cache entry was gone when this job restored it (the repo's Actions cache evicts least-recently-used entries past its size limit). Use 'Re-run all jobs': 'Re-run failed jobs' keeps the gate's old answer."
          exit 1

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Restore SDK build from cache
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/tapsmith/dist
          key: ${{ needs.gate.outputs.sdk-key }}

      - name: Download SDK build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=packages/tapsmith-core/target/release
          # download-artifact has been observed reporting success after a
          # partial extraction (tapsmith-core present, tapsmith-ios-hid
          # missing, no digest-verification lines in its log). Re-download
          # once before treating a missing binary as fatal.
          if [ ! -f "$REL/tapsmith-core" ] || [ ! -f "$REL/tapsmith-ios-hid" ]; then
            echo "daemon artifact incomplete; re-downloading"
            rm -f "$REL/tapsmith-core" "$REL/tapsmith-ios-hid"
            gh run download ${{ github.run_id }} -n daemon-binary-macos -D "$REL"
          fi
          chmod +x "$REL/tapsmith-core"
          xattr -d com.apple.quarantine "$REL/tapsmith-core" 2>/dev/null || true
          # Hard requirement, not best-effort: without the helper every
          # HID-routed gesture silently downgrades to the flaky agent path.
          chmod +x "$REL/tapsmith-ios-hid"
          xattr -d com.apple.quarantine "$REL/tapsmith-ios-hid" 2>/dev/null || true

      - name: Resolve xctestrun path
        run: |
          XCTESTRUN=$(find "$PWD/ios-agent/.build-sim" -name "*.xctestrun" -type f -print -quit)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No xctestrun found under ios-agent/.build-sim"
            exit 1
          fi
          echo "TAPSMITH_IOS_XCTESTRUN=$XCTESTRUN" >> $GITHUB_ENV
          echo "Resolved xctestrun: $XCTESTRUN"

      # The clone the CI config pins as `bob` (TAPSMITH_IOS_UDID2) boots now so
      # it is warm before the tests start — cloning a cold one after the
      # primary was up took 5 min to boot and then outlasted the agent start
      # timeout on these 3-core runners. It boots after the cache restores on
      # purpose: two simulators booting during them starved `hashFiles()` past
      # its 120 s limit.
      - name: Boot the second simulator
        run: xcrun simctl boot "$TAPSMITH_IOS_UDID2" 2>/dev/null || true

      - name: Extract test app
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          tar xzf test-app-ios.tar.gz -C e2e/fixtures

      # Production dependencies only: the job runs the prebuilt dist, which
      # (as published) needs nothing from devDependencies — 172 packages
      # instead of 387, and 2-3 min less inside the simulator boot's starved
      # window (PILOT-1133).
      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci --omit=dev

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/bin.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Wait for both simulators to boot
        run: |
          if [ -z "$TAPSMITH_IOS_UDID" ]; then
            echo "No simulator UDID resolved; skipping wait."
            exit 0
          fi
          # `bootstatus -b` returns once the boot has actually finished
          # (SpringBoard, installd, launch services), not when the device
          # merely reports `Booted`: two simulators booting side by side left
          # the primary "Booted" but starved for minutes, and the app install
          # that followed timed out. Ten minutes covers both on these runners;
          # perl's alarm is the portable timeout (macOS has no coreutils).
          for UDID in "$TAPSMITH_IOS_UDID" "$TAPSMITH_IOS_UDID2"; do
            if perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl bootstatus "$UDID" -b; then
              echo "Simulator $UDID finished booting"
            else
              echo "::error::Simulator $UDID did not finish booting within 600s"
              exit 1
            fi
          done

      - name: Run two-device E2E tests
        id: two-device
        # Advisory on this runner size — see the job comment above. Kept so a
        # manual run still uploads its results instead of stopping at the
        # expected failure.
        continue-on-error: true
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-multi.log
        # Primary pinned with --device, member pinned through the CI config.
        run: npx tapsmith test -c tapsmith.config.ios-multi-ci.mjs --trace on --device "$TAPSMITH_IOS_UDID"

      - name: Report advisory outcome
        if: steps.two-device.outcome != 'success'
        run: echo "::warning::Two-device iOS suite did not pass on this runner (advisory — see the e2e-multi-device job comment)."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-ios-multi-device
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Merge shard reports ───────────────────────────────────────────────

  e2e-report:
    name: Merge Reports
    needs: [ build-sdk, e2e-test ]
    # !cancelled(): a superseded run has nothing to report. It still runs after a
    # single job was cancelled (no runner, timeout-minutes), when the gate needs it.
    if: ${{ !cancelled() && needs.build-sdk.result == 'success' }}
    runs-on: ubuntu-latest
    # actions: merge-reports-gate.mjs reads this run's job list.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Download SDK build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Download all blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: blob-report-ios-*
          path: all-blob-reports
          merge-multiple: true

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # Fails only on a real merge error or a shard with no results that no failed
      # job accounts for. See e2e/utils/merge-gate-checks.mjs.
      - name: Merge reports
        working-directory: e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node merge-reports-gate.mjs ../all-blob-reports tapsmith.config.ios-ci.mjs

      # always(): merge-reports exits 1 when a shard's blob is missing, but it
      # still writes the report for the shards that did finish.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-ios-report
          retention-days: 30
          path: e2e/tapsmith-report/
