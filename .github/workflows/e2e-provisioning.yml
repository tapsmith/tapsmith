name: E2E Provisioning

# Tapsmith launching and booting its own devices (PILOT-483). The sharded jobs
# in e2e-android.yml and e2e-ios.yml boot their emulator or simulator in the
# workflow first — which overlaps the boot with the installs and keeps a slow
# runner's boot out of the test results — so Tapsmith only adopts a device
# there (Android Multi-device has Tapsmith launch its second member only).
# Starting from nothing, the path docs/ci-setup.md recommends, where Tapsmith
# launches the emulator (`avd` + `launchEmulators`) or boots the simulator
# (`simulator`), runs here:
#
#   - Android: no emulator running; Tapsmith launches two -read-only instances
#     of the AVD for two workers, then a rerun must reuse them.
#   - iOS: no simulator booted; Tapsmith boots the configured one.
#   - Android bare state (weekly): no AVD, no cached system image —
#     `tapsmith create-avd --install-tools` bootstraps, then the same run.
#
# Pass/fail cannot tell a launched device from an adopted one, so each job
# snapshots the host before and after the run (e2e/verify-provisioning.mjs):
# it fails if anything was booted beforehand, if Tapsmith did not start the
# device(s) the run used, or if an emulator or simulator is left running that
# Tapsmith's manifests do not track for reuse.
#
# Weekly (plus manual dispatch) rather than per-PR, like the hook-less suite.
# The pull_request paths filter runs it early on the files that implement
# provisioning; changes elsewhere (cli.ts, dispatcher.ts) are caught weekly.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, an hour after the hook-less suite
  workflow_dispatch:
  # Every PR, whatever its base (stacked PRs; see ci.yml).
  pull_request:
    paths:
      - ".github/workflows/e2e-provisioning.yml"
      - "e2e/verify-provisioning.mjs"
      - "e2e/utils/provisioning-checks.mjs"
      - "e2e/tapsmith.config.android-provisioning-ci.mjs"
      - "e2e/tapsmith.config.ios-provisioning-ci.mjs"
      - "packages/tapsmith/src/emulator.ts"
      - "packages/tapsmith/src/ios-simulator.ts"
      - "packages/tapsmith/src/create-avd.ts"
      - "packages/tapsmith/src/avd-defaults.ts"
      - "packages/tapsmith/src/avd-images.ts"
      - "packages/tapsmith/src/adb-devices.ts"
      - "packages/tapsmith/src/device-advice.ts"

concurrency:
  group: e2e-provisioning-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Tapsmith's own CI is not a user; keep its runs out of the usage counts.
  TAPSMITH_TELEMETRY: "0"
  ANDROID_SYSTEM_IMAGE: "system-images;android-36;google_apis;x86_64"
  # `tapsmith create-avd`'s default name, so the bare-state job's AVD and the
  # config's default `avd` agree without either naming it.
  AVD_NAME: "Tapsmith_Phone_API_36"

jobs:
  # ─── Build prerequisites (parallel) ────────────────────────────────────
  # Cache keys match e2e-android.yml / e2e-ios.yml exactly, so a PR whose
  # device suites already built these outputs hits their caches here.

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDK build
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: packages/tapsmith/dist
          key: sdk-dist-${{ hashFiles('packages/tapsmith/**', 'proto/tapsmith.proto',
            'ios-agent/TapsmithAgent/**', 'ios-agent/TapsmithAgent.xcodeproj/**',
            'ios-agent/create-xcode-project.sh', 'ios-agent/Package.swift') }}

      - uses: actions/setup-node@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install and build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          retention-days: 1
          path: packages/tapsmith/dist/

  build-daemon-linux:
    name: Build Daemon (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        working-directory: packages/tapsmith-core
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-binary
          retention-days: 1
          path: packages/tapsmith-core/target/release/tapsmith-core

  build-agent-android:
    name: Build Android Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            agent/.gradle
          key: ${{ runner.os }}-gradle-agent-${{ hashFiles('agent/**/*.gradle.kts',
            'agent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-agent-

      - name: Build agent APKs
        working-directory: agent
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: agent-apks
          retention-days: 1
          path: |
            agent/app/build/outputs/apk/debug/app-debug.apk
            agent/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  build-test-app-android:
    name: Build Android Test App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache test app APK
        id: test-app-cache
        uses: actions/cache@v4
        with:
          path: test-app/android/app/build/outputs/apk/release/app-release.apk
          key: test-app-android-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/plugins/**', 'test-app/package-lock.json',
            'test-app/app.json', 'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - uses: actions/setup-node@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Build @tapsmith/react-native (test-app dependency)
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        env:
          # Release builds strip __DEV__; the flag keeps the in-app reset hooks on.
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform android

      - name: Build release APK
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/android
        env:
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: test-app-apk
          retention-days: 1
          path: test-app/android/app/build/outputs/apk/release/app-release.apk

  build-daemon-macos:
    name: Build Daemon (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Before the Cargo cache restores target/ — hashFiles ignores
      # .gitignore, so a populated target/ would poison the key.
      - name: Cache daemon binaries
        id: daemon-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid
          key: ios-daemon-bin-${{ hashFiles('packages/tapsmith-core/**', 'proto/tapsmith.proto') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.daemon-cache.outputs.cache-hit != 'true'

      - name: Install protobuf compiler
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: brew install protobuf

      - name: Cache Cargo
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-core
        run: cargo build --release

      # Without the HID helper every HID-routed gesture silently downgrades
      # to the flaky XCTest agent path.
      - name: Verify HID helper was built
        run: test -x packages/tapsmith-core/target/release/tapsmith-ios-hid

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-binary-macos
          retention-days: 1
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid

  build-agent-ios:
    name: Build iOS Agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # The xctestrun bundle is tied to the Xcode/SDK that produced it.
      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9. ' '-' | xargs | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache agent build
        id: agent-cache
        uses: actions/cache@v4
        with:
          path: ios-agent/.build-sim
          key: ios-agent-build-${{ hashFiles('ios-agent/**') }}-${{ steps.xcode.outputs.version }}

      - name: Generate Xcode project
        if: steps.agent-cache.outputs.cache-hit != 'true'
        working-directory: ios-agent
        run: |
          brew install xcodegen 2>/dev/null || true
          ./create-xcode-project.sh

      - name: Build for testing
        if: steps.agent-cache.outputs.cache-hit != 'true'
        working-directory: ios-agent
        run: |
          xcodebuild build-for-testing \
            -project TapsmithAgent.xcodeproj \
            -scheme TapsmithAgentUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-sim \
            -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: ios-agent-build
          retention-days: 1
          include-hidden-files: true
          path: ios-agent/.build-sim/

  build-test-app-ios:
    name: Build iOS Test App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache test app
        id: test-app-cache
        uses: actions/cache@v4
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: test-app-ios-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json',
            'test-app/metro.config.js',
            'packages/tapsmith-react-native/src/**',
            'packages/tapsmith-react-native/package.json',
            'packages/tapsmith-react-native/tsconfig*.json') }}

      - uses: actions/setup-node@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - name: Build @tapsmith/react-native (test-app dependency)
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        env:
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        run: pod install

      - name: Build for iOS Simulator
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        env:
          EXPO_PUBLIC_TAPSMITH_HOOKS: "1"
        run: |
          xcodebuild build \
            -workspace TapsmithTestApp.xcworkspace \
            -scheme TapsmithTestApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../.build \
            -quiet

      - name: Copy to fixtures path
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          cp -R test-app/.build/Build/Products/Release-iphonesimulator/TapsmithTestApp.app e2e/fixtures/

      - name: Package test app
        run: tar czf test-app-ios.tar.gz -C e2e/fixtures TapsmithTestApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: test-app-ios
          retention-days: 1
          path: test-app-ios.tar.gz

  # ─── Android: Tapsmith launches the emulators ──────────────────────────

  android:
    name: Android (Tapsmith launches emulators)
    needs: [ build-sdk, build-daemon-linux, build-agent-android, build-test-app-android ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No ANDROID_AVD_HOME (the other Android jobs set one): create-avd has
      # to put the AVD where the emulator looks without it.
      - name: Set up Android SDK environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          # ANDROID_HOME is a runner-machine variable, invisible to the `env`
          # expression context the system-image cache path below uses.
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary
          path: packages/tapsmith-core/target/release

      - name: Download agent APKs
        uses: actions/download-artifact@v4
        with:
          name: agent-apks
          path: agent/app/build/outputs/apk

      - name: Download test app APK
        uses: actions/download-artifact@v4
        with:
          name: test-app-apk
          path: e2e/fixtures

      # e2e/node_modules/tapsmith is a `file:../packages/tapsmith` symlink, so
      # the build has to land at that real path.
      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        run: chmod +x packages/tapsmith-core/target/release/tapsmith-core

      - name: Cache Android system image
        id: system-image-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-image-${{ env.ANDROID_SYSTEM_IMAGE }}-v1

      - name: Install Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${{ env.ANDROID_SYSTEM_IMAGE }}"

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      # Artifacts don't preserve file modes; `npx tapsmith` execs dist/bin.js
      # directly through the npm bin symlink.
      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # With a cached system image and no emulator package (not preinstalled
      # on the runner image), create-avd has to install the emulator itself,
      # and pin the AVD home avdmanager writes to; the bare-state job covers
      # the uncached path. Nothing boots the AVD: launching is Tapsmith's job.
      - name: Create the AVD with tapsmith create-avd
        working-directory: e2e
        run: |
          npx tapsmith create-avd --install-tools --device pixel_6
          ls -la ~/.android/avd ~/.config/.android/avd 2>&1 || true

      - name: Check nothing is running yet
        id: before
        working-directory: e2e
        run: node verify-provisioning.mjs android-before

      # Two workers and three files: Tapsmith launches both emulators itself
      # (dispatcher → provisionEmulators), with the CI boot wait.
      - name: Run E2E tests (Tapsmith launches two emulators)
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-android-provisioning.log
        run: npx tapsmith test -c tapsmith.config.android-provisioning-ci.mjs

      - name: Check Tapsmith launched and tracks both emulators
        if: always() && steps.before.outcome == 'success'
        working-directory: e2e
        run: |
          node verify-provisioning.mjs android-after \
            --avd "${{ env.AVD_NAME }}" --expect-launched 2 \
            --save "$RUNNER_TEMP/launched-emulators.json"

      # The emulators the first run left running must be reclaimed and reused
      # (cleanupStaleEmulators → reclaimOrphanedEmulators), not relaunched.
      - name: Rerun E2E tests (Tapsmith reuses its emulators)
        id: rerun
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-android-provisioning-rerun.log
        run: npx tapsmith test -c tapsmith.config.android-provisioning-ci.mjs

      - name: Check the rerun reused both emulators
        if: always() && steps.rerun.outcome != 'skipped'
        working-directory: e2e
        run: |
          node verify-provisioning.mjs android-after \
            --avd "${{ env.AVD_NAME }}" --expect-launched 2 \
            --reuse-of "$RUNNER_TEMP/launched-emulators.json"

      - name: Collect daemon, emulator and device logs
        if: always()
        run: |
          mkdir -p e2e/tapsmith-results/provisioning-logs
          cp /tmp/tapsmith-daemon-android-provisioning*.log /tmp/tapsmith-emulator-*.log \
            e2e/tapsmith-results/provisioning-logs/ 2>/dev/null || true
          for serial in $(adb devices | awk 'NR>1 && $2=="device" {print $1}'); do
            adb -s "$serial" logcat -d -v time TapsmithAgent:V TapsmithSocket:V TestRunner:V \
              AndroidRuntime:E ActivityManager:I ReactNativeJS:V '*:W' \
              > "e2e/tapsmith-results/provisioning-logs/logcat-$serial.txt" 2>&1 || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-android-results
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            e2e/tapsmith-report/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Android bare state: create-avd, then launch (weekly) ──────────────

  # A first-time user's runner: no AVD, no cached system image, no emulator
  # package and — as on an Android Studio install — no SDK command-line
  # tools; beyond Java, only what docs/ci-setup.md says (adb on the PATH).
  # `tapsmith create-avd --install-tools` has to download the cmdline-tools,
  # fetch the image and create the AVD, and Tapsmith has to find the
  # emulator binary itself.
  android-bare:
    name: Android bare state (create-avd, then launch)
    # Weekly and on manual dispatch only: it downloads the cmdline-tools and
    # the full system image every run. The per-PR android job above already
    # runs create-avd (cached image, no emulator package, no AVD-home
    # override), so a create-avd regression still fails the PR that causes it.
    if: github.event_name != 'pull_request'
    needs: [ build-sdk, build-daemon-linux, build-agent-android, build-test-app-android ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Put adb on the PATH
        run: echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # The runner image ships the cmdline-tools; set them aside so
      # create-avd's own download-and-extract path runs.
      - name: Remove the SDK command-line tools
        run: |
          mv "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/cmdline-tools-preinstalled"
          if command -v sdkmanager || command -v avdmanager; then
            echo "::error::sdkmanager/avdmanager still on the PATH"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary
          path: packages/tapsmith-core/target/release

      - name: Download agent APKs
        uses: actions/download-artifact@v4
        with:
          name: agent-apks
          path: agent/app/build/outputs/apk

      - name: Download test app APK
        uses: actions/download-artifact@v4
        with:
          name: test-app-apk
          path: e2e/fixtures

      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        run: chmod +x packages/tapsmith-core/target/release/tapsmith-core

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      # docs/api-reference.md: "non-interactive bootstrap (CI)".
      - name: Create the AVD with tapsmith create-avd
        working-directory: e2e
        run: |
          npx tapsmith create-avd --install-tools
          # Where it landed, for diagnosis: avdmanager and the emulator have
          # disagreed about the AVD home on these runners (XDG_CONFIG_HOME).
          ls -la ~/.android/avd ~/.config/.android/avd 2>&1 || true

      - name: Check nothing is running yet
        id: before
        working-directory: e2e
        run: node verify-provisioning.mjs android-before

      - name: Run E2E tests (Tapsmith launches two emulators)
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-android-bare.log
        run: npx tapsmith test -c tapsmith.config.android-provisioning-ci.mjs

      - name: Check Tapsmith launched and tracks both emulators
        if: always() && steps.before.outcome == 'success'
        working-directory: e2e
        run: node verify-provisioning.mjs android-after --avd "${{ env.AVD_NAME }}" --expect-launched 2

      - name: Collect daemon and emulator logs
        if: always()
        run: |
          mkdir -p e2e/tapsmith-results/provisioning-logs
          cp /tmp/tapsmith-daemon-android-bare*.log /tmp/tapsmith-emulator-*.log \
            e2e/tapsmith-results/provisioning-logs/ 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-android-bare-results
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            e2e/tapsmith-report/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── iOS: Tapsmith boots the simulator ─────────────────────────────────

  ios:
    name: iOS (Tapsmith boots the simulator)
    needs: [ build-sdk, build-daemon-macos, build-agent-ios, build-test-app-ios ]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      # Picks the simulator the way e2e-ios.yml does, but never boots it.
      - name: Select Xcode and pick a simulator
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ " | head -1 | xargs)
          echo "Using simulator: $SIM"
          echo "TAPSMITH_IOS_SIMULATOR=$SIM" >> $GITHUB_ENV

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary-macos
          path: packages/tapsmith-core/target/release

      - name: Download iOS agent
        uses: actions/download-artifact@v4
        with:
          name: ios-agent-build
          path: ios-agent/.build-sim

      - name: Download test app
        uses: actions/download-artifact@v4
        with:
          name: test-app-ios
          path: .

      - name: Download SDK build
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: packages/tapsmith/dist

      - name: Make daemon executable
        run: |
          REL=packages/tapsmith-core/target/release
          for bin in tapsmith-core tapsmith-ios-hid; do
            test -f "$REL/$bin" || { echo "::error::$bin missing from the daemon artifact"; exit 1; }
            chmod +x "$REL/$bin"
            xattr -d com.apple.quarantine "$REL/$bin" 2>/dev/null || true
          done

      - name: Resolve xctestrun path
        run: |
          XCTESTRUN=$(find "$PWD/ios-agent/.build-sim" -name "*.xctestrun" -type f -print -quit)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No xctestrun found under ios-agent/.build-sim"
            exit 1
          fi
          echo "TAPSMITH_IOS_XCTESTRUN=$XCTESTRUN" >> $GITHUB_ENV

      - name: Extract test app
        run: |
          mkdir -p e2e/fixtures
          tar xzf test-app-ios.tar.gz -C e2e/fixtures

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Make SDK CLI executable
        run: chmod +x packages/tapsmith/dist/bin.js packages/tapsmith/dist/cli.js

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Check nothing is booted yet
        id: before
        working-directory: e2e
        run: node verify-provisioning.mjs ios-before --simulator "$TAPSMITH_IOS_SIMULATOR"

      - name: Run E2E tests (Tapsmith boots the simulator)
        working-directory: e2e
        env:
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-provisioning.log
        run: npx tapsmith test -c tapsmith.config.ios-provisioning-ci.mjs

      - name: Check Tapsmith booted the simulator and left nothing behind
        if: always() && steps.before.outcome == 'success'
        working-directory: e2e
        run: node verify-provisioning.mjs ios-after --simulator "$TAPSMITH_IOS_SIMULATOR"

      - name: Collect daemon log
        if: always()
        run: |
          mkdir -p e2e/tapsmith-results/provisioning-logs
          cp /tmp/tapsmith-daemon-ios-provisioning*.log e2e/tapsmith-results/provisioning-logs/ 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-ios-results
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            e2e/tapsmith-report/
            !e2e/tapsmith-results/**/*.tar.gz
