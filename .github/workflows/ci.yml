name: CI

on:
  push:
    # release/** so the auto-created release PR (pushed via the deploy key)
    # gets CI — a GITHUB_TOKEN-authored PR does not trigger pull_request runs.
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: Lint protobuf definitions
        run: buf lint proto/

      - name: Check breaking changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: buf breaking proto/ --against '.git#ref=origin/main,subdir=proto'

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tapsmith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # cjs-project.test.ts and module-format-guard.test.ts drive the built SDK
      # (and fail, not skip, under CI when it is missing). Only the tsc output
      # is needed; the full build stays below so a broken web-app build does
      # not hide the unit-test results.
      - name: Build SDK for the unit tests
        run: npx tsc

      - name: Unit tests
        run: npx vitest run

      - name: Unused code check (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      # The E2E helper scripts (trace-archive content checks, xctestrun
      # discovery) are plain Node with their own node:test suites and need no
      # device. They ran nowhere before; the trace-archive checks in particular
      # are what the device workflows rely on to fail loudly, so a check that
      # silently stops firing has to be caught here.
      - name: E2E helper tests
        working-directory: e2e
        run: |
          npm ci
          npm test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tapsmith-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

  rust-macos:
    # Compiles tapsmith-core on macOS so the macOS-gated iOS network capture
    # path (src/ios_redirect.rs, transparent-TCP MITM, vendored mitmproxy
    # IPC proto) is exercised by CI. The Linux rust job above can't catch
    # cfg(target_os = "macos") regressions on its own. Also the one macOS job
    # without a simulator, so it runs the iOS agent's host-side unit tests.
    name: Rust (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/tapsmith-core
    steps:
      - uses: actions/checkout@v4

      - name: iOS agent unit tests
        working-directory: ios-agent
        run: Tests/run-unit-tests.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            agent/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('agent/**/*.gradle.kts', 'agent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint with ktlint
        run: ./gradlew ktlintCheck

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unused code check (knip)
        run: npm run knip

      - name: Build (includes doc sync + link validation)
        run: npm run build

  test-app:
    name: Test App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-app/package-lock.json
            packages/tapsmith-react-native/package-lock.json

      - name: Build @tapsmith/react-native (test-app dependency)
        working-directory: packages/tapsmith-react-native
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unused code check (knip)
        run: npm run knip

  react-native:
    name: React Native hooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tapsmith-react-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/tapsmith-react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  ui-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            web-tests/package-lock.json

      # The suite drives the built single-file apps (dist/ui-mode/index.html and
      # dist/trace-viewer/index.html) — the same artifacts ui-server.ts and
      # show-trace serve to users — so the SDK has to be built first. This job
      # builds its own copy rather than depending on the typescript job: they run
      # in parallel, so it costs no wall-clock time and keeps the check
      # independent.
      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Build SDK (includes both web app bundles)
        working-directory: packages/tapsmith
        run: npm run build

      - name: Install web-test dependencies
        working-directory: web-tests
        run: npm ci

      - name: Type check
        working-directory: web-tests
        run: npm run typecheck

      # Chromium only: this is our own app on one engine, not a cross-browser
      # support matrix.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web-tests/package-lock.json') }}

      - name: Install Chromium
        working-directory: web-tests
        run: npx playwright install --with-deps chromium

      - name: Run web tests
        working-directory: web-tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web-tests/playwright-report/
            web-tests/test-results/
          retention-days: 7
