name: Tag release

# Fires when a "Release vX.Y.Z" PR (labelled `release`) is merged. Reads the
# version that landed on main, tags that commit, and pushes the tag over SSH
# (deploy key) so it triggers release.yml. A tag pushed with the default
# GITHUB_TOKEN would not trigger any workflow.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    name: Tag merged release
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Verify RELEASE_SSH_KEY is set
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          if [ -z "$RELEASE_SSH_KEY" ]; then
            echo "::error::RELEASE_SSH_KEY secret is not set; a tag pushed with GITHUB_TOKEN will not trigger release.yml. Add the deploy key (see .github/releasing.md), then push the tag manually: git tag vX.Y.Z <merge-sha> && git push origin vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Create and push tag
        run: |
          VERSION=$(node -p "require('./packages/tapsmith/package.json').version")
          TAG="v$VERSION"
          HEAD_SHA=$(git rev-parse HEAD)
          # Peeled ref (^{}) resolves an annotated tag to the commit it points at;
          # fall back to the plain ref for a lightweight tag.
          REMOTE_SHA=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')
          [ -z "$REMOTE_SHA" ] && REMOTE_SHA=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" = "$HEAD_SHA" ]; then
              echo "Tag $TAG already points at $HEAD_SHA; nothing to do."
              exit 0
            fi
            echo "::error::Tag $TAG already exists but points at $REMOTE_SHA, not the merged commit $HEAD_SHA. Refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          # Pushed over SSH (deploy key) so release.yml's tag trigger fires.
          git push origin "$TAG"
          echo "Pushed $TAG"
