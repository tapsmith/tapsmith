syntax = "proto3";

package tapsmith;

// ─── Service: TypeScript SDK ↔ Rust Daemon ───

service TapsmithService {
  rpc FindElement(FindElementRequest) returns (FindElementResponse);
  rpc FindElements(FindElementsRequest) returns (FindElementsResponse);
  rpc Tap(TapRequest) returns (ActionResponse);
  rpc LongPress(LongPressRequest) returns (ActionResponse);
  rpc TypeText(TypeTextRequest) returns (ActionResponse);
  rpc ClearText(ClearTextRequest) returns (ActionResponse);
  rpc ClearAndType(ClearAndTypeRequest) returns (ActionResponse);
  rpc Swipe(SwipeRequest) returns (ActionResponse);
  rpc TapCoordinates(TapCoordinatesRequest) returns (ActionResponse);
  rpc LongPressCoordinates(LongPressCoordinatesRequest) returns (ActionResponse);
  rpc DragCoordinates(DragCoordinatesRequest) returns (ActionResponse);
  rpc InputText(InputTextRequest) returns (ActionResponse);
  rpc TouchDown(TouchPointRequest) returns (ActionResponse);
  rpc TouchMove(TouchPointRequest) returns (ActionResponse);
  rpc TouchUp(TouchPointRequest) returns (ActionResponse);
  rpc TouchCancel(TouchCancelRequest) returns (ActionResponse);
  rpc Scroll(ScrollRequest) returns (ActionResponse);
  rpc PressKey(PressKeyRequest) returns (ActionResponse);
  rpc TakeScreenshot(ScreenshotRequest) returns (ScreenshotResponse);
  rpc GetUiHierarchy(UiHierarchyRequest) returns (UiHierarchyResponse);
  rpc WaitForIdle(WaitForIdleRequest) returns (ActionResponse);
  rpc InstallApk(InstallApkRequest) returns (ActionResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc SetDevice(SetDeviceRequest) returns (ActionResponse);
  rpc StartAgent(StartAgentRequest) returns (ActionResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc DoubleTap(DoubleTapRequest) returns (ActionResponse);
  rpc DragAndDrop(DragAndDropRequest) returns (ActionResponse);
  rpc SelectOption(SelectOptionRequest) returns (ActionResponse);
  rpc PinchZoom(PinchZoomRequest) returns (ActionResponse);
  rpc Focus(FocusRequest) returns (ActionResponse);
  rpc Blur(BlurRequest) returns (ActionResponse);
  rpc Highlight(HighlightRequest) returns (ActionResponse);
  rpc TakeElementScreenshot(TakeElementScreenshotRequest) returns (ScreenshotResponse);

  // ─── Device Management (PILOT-10) ───
  rpc LaunchApp(LaunchAppRequest) returns (ActionResponse);
  rpc OpenDeepLink(OpenDeepLinkRequest) returns (ActionResponse);
  rpc GetCurrentPackage(GetCurrentPackageRequest) returns (GetCurrentPackageResponse);
  rpc GetCurrentActivity(GetCurrentActivityRequest) returns (GetCurrentActivityResponse);
  rpc TerminateApp(TerminateAppRequest) returns (ActionResponse);
  rpc GetAppState(GetAppStateRequest) returns (GetAppStateResponse);
  rpc ClearAppData(ClearAppDataRequest) returns (ActionResponse);
  rpc GrantPermission(GrantPermissionRequest) returns (ActionResponse);
  rpc RevokePermission(RevokePermissionRequest) returns (ActionResponse);
  rpc SetClipboard(SetClipboardRequest) returns (ActionResponse);
  rpc GetClipboard(GetClipboardRequest) returns (GetClipboardResponse);
  rpc SetOrientation(SetOrientationRequest) returns (ActionResponse);
  rpc GetOrientation(GetOrientationRequest) returns (GetOrientationResponse);
  rpc IsKeyboardShown(IsKeyboardShownRequest) returns (IsKeyboardShownResponse);
  rpc HideKeyboard(HideKeyboardRequest) returns (ActionResponse);
  rpc OpenNotifications(OpenNotificationsRequest) returns (ActionResponse);
  rpc OpenQuickSettings(OpenQuickSettingsRequest) returns (ActionResponse);
  rpc SetColorScheme(SetColorSchemeRequest) returns (ActionResponse);
  rpc GetColorScheme(GetColorSchemeRequest) returns (GetColorSchemeResponse);
  rpc WakeDevice(WakeDeviceRequest) returns (ActionResponse);
  rpc UnlockDevice(UnlockDeviceRequest) returns (ActionResponse);
  rpc RestartApp(RestartAppRequest) returns (ActionResponse);
  // Bring the app to a known state per the SDK's declared isolation policy
  // (warm in-app hook → restart → clear, with fallbacks) and report exactly
  // which rung ran and why, so the trace stays honest.
  rpc ResetApp(ResetAppRequest) returns (ResetAppResponse);

  // ─── App State Snapshot (PILOT-115) ───
  rpc SaveAppState(SaveAppStateRequest) returns (ActionResponse);
  rpc RestoreAppState(RestoreAppStateRequest) returns (ActionResponse);

  // ─── Trace Support (PILOT-85) ───
  rpc GetLogcat(GetLogcatRequest) returns (GetLogcatResponse);
  rpc CaptureTraceState(CaptureTraceStateRequest) returns (CaptureTraceStateResponse);

  // ─── Device Log Streaming (PILOT-193) ───
  // Server-side stream that tails device logs (Android logcat / iOS
  // simulator syslog), filtered to the app-under-test's process.
  // Cancel the stream to stop.
  rpc StreamDeviceLogs(StreamDeviceLogsRequest) returns (stream DeviceLogEntry);
  rpc StreamDaemonLogs(StreamDaemonLogsRequest) returns (stream DaemonLogEntry);

  // ─── Network Capture (PILOT-164) ───
  rpc StartNetworkCapture(StartNetworkCaptureRequest) returns (StartNetworkCaptureResponse);
  rpc StopNetworkCapture(StopNetworkCaptureRequest) returns (StopNetworkCaptureResponse);
  rpc SnapshotNetworkCapture(SnapshotNetworkCaptureRequest) returns (SnapshotNetworkCaptureResponse);

  // ─── Physical iOS device network capture (PILOT-185) ───
  // Generates a `.mobileconfig` profile that the user installs on a
  // physical iOS device to route Wi-Fi traffic through Tapsmith's MITM proxy
  // on a deterministic per-UDID host port.
  rpc GenerateIosNetworkProfile(GenerateIosNetworkProfileRequest) returns (GenerateIosNetworkProfileResponse);

  // ─── Network Route Interception ───
  // Bidirectional stream for intercepting and mocking device network
  // requests. The SDK registers URL patterns; the daemon pauses matching
  // requests and sends them to the SDK for a routing decision (abort,
  // continue with modifications, or fulfill with a mock response).
  rpc NetworkRoute(stream NetworkRouteClientMessage) returns (stream NetworkRouteServerMessage);

  // ─── WebView Testing (PILOT-116) ───
  // Discover and connect to WebViews for hybrid app testing via CDP.
  // Android: discovers devtools_remote sockets via /proc/net/unix.
  // iOS: uses ios-webkit-debug-proxy to expose WebKit Inspector via CDP.
  rpc ListWebViews(ListWebViewsRequest) returns (ListWebViewsResponse);
  rpc ForwardWebViewPort(ForwardWebViewPortRequest) returns (ForwardWebViewPortResponse);
  rpc CloseWebViewPort(CloseWebViewPortRequest) returns (ActionResponse);

  // ─── Video Recording (PILOT-114) ───
  // Continuous screen recording over the lifetime of a test, mirroring
  // Playwright's `video` config. Start/stop are unary RPCs; the recorded
  // MP4 is returned inline in the StopVideoRecording response.
  rpc StartVideoRecording(StartVideoRecordingRequest) returns (ActionResponse);
  rpc StopVideoRecording(StopVideoRecordingRequest) returns (StopVideoRecordingResponse);
}

// ─── Common Types ───

message Selector {
  oneof selector {
    RoleSelector role = 1;
    string text = 2;
    string text_contains = 3;
    string content_desc = 4;
    string hint = 5;
    string class_name = 6;
    string test_id = 7;
    string resource_id = 8;
    string xpath = 9;
    string label = 11;
  }
  Selector parent = 10;
}

message RoleSelector {
  string role = 1;
  string name = 2;
  optional bool checked = 3;
  optional bool disabled = 4;
  optional bool selected = 5;
  optional bool expanded = 6;
}

message ElementInfo {
  string element_id = 1;
  string class_name = 2;
  string text = 3;
  string content_description = 4;
  string resource_id = 5;
  bool enabled = 6;
  bool visible = 7;
  bool clickable = 8;
  bool focusable = 9;
  bool scrollable = 10;
  Bounds bounds = 11;
  string hint = 12;
  bool checked = 13;
  bool selected = 14;
  bool focused = 15;
  string role = 16;
  float viewport_ratio = 17;
}

message Bounds {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

message ActionResponse {
  string request_id = 1;
  bool success = 2;
  string error_type = 3;
  string error_message = 4;
  bytes screenshot = 5;
}

// ─── Requests ───

message FindElementRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
}

message FindElementResponse {
  string request_id = 1;
  bool found = 2;
  ElementInfo element = 3;
  string error_message = 4;
}

message FindElementsRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
}

message FindElementsResponse {
  string request_id = 1;
  repeated ElementInfo elements = 2;
  string error_message = 3;
}

// Most action requests carry an optional `element_id`: the stable id the agent
// assigned to a previously-found element (returned in ElementInfo). When set,
// the agent acts on that exact cached element instead of re-finding by selector
// — this is how positional/filtered handles (.first()/.last()/.nth()/.filter())
// address the specific element they resolved, even when its accessibility
// property is shared with an earlier sibling. Either `selector` or `element_id`
// must be provided.
message TapRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
  string element_id = 4;
}

message LongPressRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 duration_ms = 3;
  uint64 timeout_ms = 4;
  string element_id = 5;
}

message TypeTextRequest {
  string request_id = 1;
  Selector selector = 2;
  string text = 3;
  uint64 timeout_ms = 4;
  // Delay in ms between keystrokes. Helps prevent dropped characters
  // on slow CI simulators/emulators. 0 = no delay (default).
  uint32 typing_delay_ms = 5;
  string element_id = 6;
}

message ClearTextRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
  string element_id = 4;
}

message ClearAndTypeRequest {
  string request_id = 1;
  Selector selector = 2;
  string text = 3;
  uint64 timeout_ms = 4;
  uint32 typing_delay_ms = 5;
  string element_id = 6;
}

message SwipeRequest {
  string request_id = 1;
  string direction = 2;
  Selector start_element = 3;
  float speed = 4;
  float distance = 5;
  uint64 timeout_ms = 6;
}

// Coordinate-based gestures. Coordinates are logical points (Android: pixels,
// since devicePixelRatio == 1; iOS: points). Used by the SDK coordinate API
// and UI mode's interactive mirror.
message TapCoordinatesRequest {
  string request_id = 1;
  float x = 2;
  float y = 3;
}

message LongPressCoordinatesRequest {
  string request_id = 1;
  float x = 2;
  float y = 3;
  uint64 duration_ms = 4;
}

message DragCoordinatesRequest {
  string request_id = 1;
  float from_x = 2;
  float from_y = 3;
  float to_x = 4;
  float to_y = 5;
  uint64 duration_ms = 6;
}

// Type text into whatever currently has focus (focusless typing).
message InputTextRequest {
  string request_id = 1;
  string text = 2;
  // Delay in ms between keystrokes. Mirrors TypeTextRequest so focused-field
  // input can use the same guarded iOS typing path.
  uint32 typing_delay_ms = 3;
}

// Streamed touch gesture (interactive mirror live-drag). Coordinates are
// logical points. A gesture is TouchDown, then TouchMove*, then TouchUp (or
// TouchCancel). Android injects each event live; iOS buffers the path and
// dispatches it as one gesture on TouchUp, using t_ms to reconstruct timing.
message TouchPointRequest {
  string request_id = 1;
  float x = 2;
  float y = 3;
  // Milliseconds since this gesture's TouchDown (0 for TouchDown itself).
  uint64 t_ms = 4;
}

message TouchCancelRequest {
  string request_id = 1;
}

message ScrollRequest {
  string request_id = 1;
  Selector container = 2;
  string direction = 3;
  Selector scroll_until_visible = 4;
  float distance = 5;
  uint64 timeout_ms = 6;
  // Cached id of the scroll container (instead of `container`), for a
  // positional/filtered handle. See the note above the action requests.
  string element_id = 7;
}

message PressKeyRequest {
  string request_id = 1;
  string key = 2;
}

message ScreenshotRequest {
  string request_id = 1;
}

message ScreenshotResponse {
  string request_id = 1;
  bool success = 2;
  bytes data = 3;
  string error_message = 4;
}

message UiHierarchyRequest {
  string request_id = 1;
}

message UiHierarchyResponse {
  string request_id = 1;
  string hierarchy_xml = 2;
  string error_message = 3;
}

message WaitForIdleRequest {
  string request_id = 1;
  uint64 timeout_ms = 2;
}

message InstallApkRequest {
  string request_id = 1;
  string apk_path = 2;
}

message ListDevicesRequest {
  string request_id = 1;
}

message DeviceInfo {
  string serial = 1;
  string model = 2;
  string state = 3;
  bool is_emulator = 4;
  string platform = 5;  // "android" or "ios"
  // Human-friendly OS version ("14", "18.1", "26.2.1"). Empty when unknown.
  // Android: ro.build.version.release. iOS sim: runtime version. iOS physical:
  // filled CLI-side from devicectl (daemon leaves blank).
  string os_version = 6;
}

message ListDevicesResponse {
  string request_id = 1;
  repeated DeviceInfo devices = 2;
}

message SetDeviceRequest {
  string request_id = 1;
  string serial = 2;
  // When false, the daemon skips every physical-iOS network-capture code
  // path for this session — no MITM proxy pre-start, no OCSP passthrough
  // pre-arming. Default (false) keeps the basic-track failure surface
  // minimal; the CLI sets this to true only when the user's tapsmith.config.ts
  // has tracing enabled (trace.mode !== 'off' && trace.network !== false).
  // The daemon stays agnostic of tapsmith.config.ts; the CLI is the single
  // source of truth.
  bool network_tracing_enabled = 3;
  // Host-glob allowlist for the PAC script served at /tapsmith.pac on
  // physical iOS. When empty, the PAC routes every host through the
  // proxy (matching the old ProxyType=Manual behavior). Sourced from
  // `trace.networkHosts` in tapsmith.config.ts. Only meaningful when
  // `network_tracing_enabled == true`.
  repeated string network_hosts = 4;
  // Host globs whose TLS connections the MITM proxy tunnels end-to-end
  // instead of intercepting — no capture, no routing, but the app talks
  // to its real backend (useful for certificate-pinned hosts). Matched
  // against the TLS ClientHello SNI. Sourced from
  // `trace.networkPassthroughHosts` in tapsmith.config.ts. Empty = no
  // host-based passthrough; HTTP/2-only clients (gRPC) are always
  // tunneled automatically regardless of this list (PILOT-231).
  repeated string passthrough_hosts = 5;
}

message StartAgentRequest {
  string request_id = 1;
  string target_package = 2;
  string agent_apk_path = 3;       // host path to agent APK (auto-install, Android)
  string agent_test_apk_path = 4;  // host path to agent test APK (auto-install, Android)
  string ios_xctestrun_path = 5;   // host path to .xctestrun file (iOS)
  // host path to the .app bundle installed on the device. Used by the
  // daemon on physical iOS devices to reinstall the app on clearAppData
  // calls (devicectl has no host-side app container access, so reinstall
  // is the only way to reset persistent state). Empty for simulators.
  string ios_app_path = 6;
  // Same semantics as SetDeviceRequest.network_tracing_enabled — gates
  // `ensure_ios_physical_proxy` pre-arming on the start_agent path.
  bool network_tracing_enabled = 7;
}

message PingRequest {}

message PingResponse {
  string version = 1;
  bool agent_connected = 2;
}

// ─── Element Actions (PILOT-2) ───

message DoubleTapRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
  uint64 interval_ms = 4;
  string element_id = 5;
}

message DragAndDropRequest {
  string request_id = 1;
  Selector source_selector = 2;
  Selector target_selector = 3;
  uint64 timeout_ms = 4;
  // Cached ids of the source/target elements (instead of the selectors), for
  // positional/filtered handles. Either selector or element_id per end.
  string source_element_id = 5;
  string target_element_id = 6;
}

message SelectOptionRequest {
  string request_id = 1;
  Selector selector = 2;
  oneof selection {
    string option = 3;
    int32 index = 4;
  }
  uint64 timeout_ms = 5;
  string element_id = 6;
}

message PinchZoomRequest {
  string request_id = 1;
  Selector selector = 2;
  float scale = 3;
  uint64 timeout_ms = 4;
  string element_id = 5;
}

message FocusRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
  string element_id = 4;
}

message BlurRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
  string element_id = 4;
}

message HighlightRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 duration_ms = 3;
  uint64 timeout_ms = 4;
  string element_id = 5;
}

message TakeElementScreenshotRequest {
  string request_id = 1;
  Selector selector = 2;
  uint64 timeout_ms = 3;
  string element_id = 4;
}

// ─── Device Management (PILOT-10) ───

message LaunchAppRequest {
  string request_id = 1;
  string package_name = 2;
  string activity = 3;       // optional: specific activity to launch
  bool clear_data = 4;       // clear app data before launch
  bool wait_for_idle = 5;    // wait for UI to settle after launch
  uint64 idle_timeout_ms = 6; // timeout for waitForIdle (0 = use default 10s)
}

message OpenDeepLinkRequest {
  string request_id = 1;
  string uri = 2;
  // Skip the warm in-process delivery attempt and go straight to the cold
  // terminate -> relaunch path. Only meaningful on iOS simulators (Android
  // and physical iOS always deliver warm). The runner sets this on retry
  // attempts; the daemon's own reset policy (see ResetAppRequest) bounds the
  // warm window between cold relaunches for declared app resets.
  bool force_cold_launch = 3;
}

message GetCurrentPackageRequest {
  string request_id = 1;
}

message GetCurrentPackageResponse {
  string request_id = 1;
  string package_name = 2;
}

message GetCurrentActivityRequest {
  string request_id = 1;
}

message GetCurrentActivityResponse {
  string request_id = 1;
  string activity = 2;
}

message TerminateAppRequest {
  string request_id = 1;
  string package_name = 2;
}

message GetAppStateRequest {
  string request_id = 1;
  string package_name = 2;
}

message GetAppStateResponse {
  string request_id = 1;
  string state = 2;  // "not_installed" | "stopped" | "background" | "foreground"
}

message ClearAppDataRequest {
  string request_id = 1;
  string package_name = 2;
}

message GrantPermissionRequest {
  string request_id = 1;
  string package_name = 2;
  string permission = 3;
}

message RevokePermissionRequest {
  string request_id = 1;
  string package_name = 2;
  string permission = 3;
}

message SetClipboardRequest {
  string request_id = 1;
  string text = 2;
}

message GetClipboardRequest {
  string request_id = 1;
}

message GetClipboardResponse {
  string request_id = 1;
  string text = 2;
}

message SetOrientationRequest {
  string request_id = 1;
  string orientation = 2;  // "portrait" | "landscape"
}

message GetOrientationRequest {
  string request_id = 1;
}

message GetOrientationResponse {
  string request_id = 1;
  string orientation = 2;
}

message IsKeyboardShownRequest {
  string request_id = 1;
}

message IsKeyboardShownResponse {
  string request_id = 1;
  bool shown = 2;
}

message HideKeyboardRequest {
  string request_id = 1;
}

message OpenNotificationsRequest {
  string request_id = 1;
}

message OpenQuickSettingsRequest {
  string request_id = 1;
}

message SetColorSchemeRequest {
  string request_id = 1;
  string scheme = 2;  // "dark" | "light"
}

message GetColorSchemeRequest {
  string request_id = 1;
}

message GetColorSchemeResponse {
  string request_id = 1;
  string scheme = 2;
}

message WakeDeviceRequest {
  string request_id = 1;
}

message UnlockDeviceRequest {
  string request_id = 1;
}

message RestartAppRequest {
  string request_id = 1;
  string package_name = 2;
  bool wait_for_idle = 3;
  uint64 idle_timeout_ms = 4; // timeout for waitForIdle (0 = use default 10s)
}

// How far a declared app reset goes. See TapsmithConfig.appReset in the SDK.
enum AppResetMode {
  APP_RESET_MODE_UNSPECIFIED = 0;
  // In-app reset through a reset hook (@tapsmith/react-native marker, or the
  // legacy reset_deep_link); the process is kept.
  APP_RESET_MODE_WARM = 1;
  // Terminate and relaunch, keeping persisted data.
  APP_RESET_MODE_RESTART = 2;
  // Clear app data and relaunch.
  APP_RESET_MODE_CLEAR = 3;
}

message ResetAppRequest {
  string request_id = 1;
  string package_name = 2;
  AppResetMode mode = 3;
  // Escalate WARM -> RESTART -> CLEAR when a rung fails. When false, a failed
  // rung fails the request.
  bool allow_fallback = 4;
  // Explicit reset deep link (SDK `resetAppDeepLink`). Used when the app does
  // not advertise in-app hooks. Empty = none.
  string reset_deep_link = 5;
  // Policy inputs — the SDK is the config source of truth:
  // Deliver a warm reset cold (terminate + relaunch). Set on retry attempts.
  bool force_cold = 6;
  // Force a cold relaunch after this many consecutive warm resets to bound
  // the warm window on iOS simulators (PILOT-249). 0 disables the valve.
  uint32 cold_every_n_resets = 7;
  bool wait_for_idle = 8;
  uint64 idle_timeout_ms = 9; // 0 = default 10s
  // App route the reset should land on (default "/"). Passed to the in-app hook.
  string target_path = 10;
  // When a warm reset cannot run (or land), fall back to CLEAR instead of
  // RESTART. Set by the runner's declared isolation policy: a warm policy's
  // promise is state-clearing, and a restart keeps persisted data. Explicit
  // `device.resetApp()` calls leave this false and keep the gentler ladder.
  bool fallback_to_clear = 11;
}

message ResetStep {
  string name = 1;         // warm-hooks | warm-deep-link | restart | clear
  uint64 duration_ms = 2;
  bool ok = 3;
  string detail = 4;       // failure message when !ok
}

message ResetAppResponse {
  string request_id = 1;
  bool success = 2;
  string error_type = 3;
  string error_message = 4;
  bytes screenshot = 5;
  AppResetMode mode_requested = 6;
  AppResetMode mode_used = 7;
  bool fell_back = 8;
  // The app process was recreated (cold deep-link delivery, restart or clear).
  bool cold_launch = 9;
  // Human explanation for a fallback or cold decision, e.g.
  // "cold relaunch: warm-window bound reached (10 resets)".
  string reason = 10;
  uint64 duration_ms = 11;
  // A @tapsmith/react-native marker was found in the UI hierarchy.
  bool hooks_detected = 12;
  uint64 epoch_before = 13;
  uint64 epoch_after = 14;
  repeated ResetStep steps = 15;
}

// ─── App State Snapshot (PILOT-115) ───

message SaveAppStateRequest {
  string request_id = 1;
  string package_name = 2;
  string path = 3;             // local filesystem path to save the archive to
}

message RestoreAppStateRequest {
  string request_id = 1;
  string package_name = 2;
  string path = 3;             // local filesystem path of the archive to restore
}

// ─── Trace Support (PILOT-85) ───

message GetLogcatRequest {
  string request_id = 1;
  string package_name = 2;   // filter by app package (resolved to PID)
  uint64 since_ms = 3;       // only return entries after this epoch timestamp
  uint64 until_ms = 4;       // only return entries before this timestamp (0 = now)
}

message GetLogcatResponse {
  string request_id = 1;
  string logcat = 2;         // raw logcat output
  string error_message = 3;
}

message CaptureTraceStateRequest {
  string request_id = 1;
  bool screenshot = 2;
  bool hierarchy = 3;
  Selector element_selector = 4;  // optional — omit to skip element lookup
}

message CaptureTraceStateResponse {
  string request_id = 1;
  bool success = 2;
  string error_message = 3;
  bytes screenshot_data = 4;
  string hierarchy_xml = 5;
  bool element_found = 6;
  ElementInfo element = 7;
}

// ─── Device Log Streaming (PILOT-193) ───

message StreamDeviceLogsRequest {
  string request_id = 1;
  string package_name = 2;   // filter by app package / bundle ID
}

message DeviceLogEntry {
  string level = 1;           // "debug" | "info" | "warn" | "error" | "log"
  string message = 2;
  string tag = 3;             // Android tag / iOS subsystem
  uint64 timestamp_ms = 4;    // epoch milliseconds
  int32 pid = 5;
}

message StreamDaemonLogsRequest {
  string request_id = 1;
}

message DaemonLogEntry {
  string level = 1;          // "debug" | "info" | "warn" | "error"
  string message = 2;        // formatted log message
  string target = 3;         // tracing target, e.g. "tapsmith_core::adb"
  string request_id = 4;     // request_id of the originating RPC, or "" if daemon-global
  uint64 timestamp_ms = 5;   // epoch milliseconds
}

// ─── Network Capture (PILOT-164) ───

message StartNetworkCaptureRequest {
  string request_id = 1;
  // When true, the daemon only starts capture on a route that attributes
  // traffic to this device alone (iOS simulator: the per-PID Network
  // Extension redirector). It refuses the host-wide macOS system-proxy
  // fallback and returns success=false instead, because that fallback records
  // every process on the Mac. Set by the runner for multi-device groups, where
  // entries are labelled with the capturing device's name.
  bool require_isolation = 2;
  // Additional cleartext HTTP/1.1 or HTTP/2 ports to intercept on Android.
  repeated uint32 http_ports = 3;
}

message StartNetworkCaptureResponse {
  string request_id = 1;
  bool success = 2;
  uint32 proxy_port = 3;     // port the proxy is listening on
  string error_message = 4;
  // How the device's traffic reaches the proxy. UNSPECIFIED when success is
  // false. The runner records it per device in the trace metadata, so a trace
  // captured through the host-wide system proxy says so.
  NetworkCaptureRoute route = 5;
}

// How a device's traffic is routed into the capture proxy.
enum NetworkCaptureRoute {
  NETWORK_CAPTURE_ROUTE_UNSPECIFIED = 0;
  // iOS simulator: per-PID macOS Network Extension redirector. Device-isolated.
  NETWORK_CAPTURE_ROUTE_IOS_NETWORK_EXTENSION = 1;
  // iOS simulator: macOS system HTTP(S) proxy fallback. Host-wide: records
  // every process on the Mac, and never sees requests to localhost.
  NETWORK_CAPTURE_ROUTE_IOS_SYSTEM_PROXY = 2;
  // Physical iOS device: the installed Wi-Fi proxy profile.
  NETWORK_CAPTURE_ROUTE_IOS_DEVICE_PROXY = 3;
  // Android: iptables transparent redirect.
  NETWORK_CAPTURE_ROUTE_ANDROID_TRANSPARENT = 4;
  // Android: `settings global http_proxy` fallback (proxy-aware clients only).
  NETWORK_CAPTURE_ROUTE_ANDROID_HTTP_PROXY = 5;
}

message StopNetworkCaptureRequest {
  string request_id = 1;
  // When true, return and clear captured entries without tearing down the
  // proxy/routing configuration. The caller must later call StopNetworkCapture
  // with keep_running=false to restore device proxy state.
  bool keep_running = 2;
}

// Read current capture without draining entries or changing proxy/routing state.
message SnapshotNetworkCaptureRequest {
  string request_id = 1;
  repeated CapturedBodyVersion known_bodies = 2;
  // Opt in to omitted unchanged bodies and bounded body transfer per poll.
  bool incremental_bodies = 3;
}

message CapturedBodyVersion {
  string capture_id = 1;
  uint32 request_body_size = 2;
  uint32 response_body_size = 3;
}

message SnapshotNetworkCaptureResponse {
  string request_id = 1;
  bool success = 2;
  repeated CapturedNetworkEntry entries = 3;
  string error_message = 4;
}

message CapturedNetworkEntry {
  string method = 1;
  string url = 2;
  int32 status_code = 3;
  string content_type = 4;
  uint64 request_size = 5;
  uint64 response_size = 6;
  uint64 start_time_ms = 7;  // epoch ms
  uint64 duration_ms = 8;
  string request_headers_json = 9;   // JSON-encoded headers
  string response_headers_json = 10;
  bytes request_body = 11;
  bytes response_body = 12;
  bool is_https = 13;
  // How this request was handled by a route: "mocked", "aborted",
  // "continued", "fetched", or "" (no route matched / passthrough).
  string route_action = 14;
  // Still open at capture time: bodies, sizes and duration are a snapshot so far.
  bool in_flight = 15;
  // Stable for the lifetime of a proxy, including open -> completed transitions.
  string capture_id = 16;
  // Retain the prior body when true. False + empty bytes clears the body.
  // Omission may mean unchanged bytes or transfer deferred to a later poll.
  bool request_body_omitted = 17;
  bool response_body_omitted = 18;
}

message StopNetworkCaptureResponse {
  string request_id = 1;
  bool success = 2;
  repeated CapturedNetworkEntry entries = 3;
  string error_message = 4;
}

// ─── Physical iOS device network capture (PILOT-185) ───

message GenerateIosNetworkProfileRequest {
  string request_id = 1;
  // Target device UDID. Must match a physical device returned by ListDevices.
  string udid = 2;
  // Optional Wi-Fi SSID to include in the mobileconfig. Empty = auto-detect
  // the host's current Wi-Fi network.
  string ssid = 3;
  // Optional human-readable name for the device (used in PayloadDisplayName).
  // Defaults to the device's name from devicectl if empty.
  string device_name = 4;
}

message GenerateIosNetworkProfileResponse {
  string request_id = 1;
  bool success = 2;
  string error_message = 3;
  // Absolute path to the generated .mobileconfig file.
  string profile_path = 4;
  // Host IP the profile points at.
  string host_ip = 5;
  // Deterministic TCP port assigned for this UDID.
  uint32 port = 6;
  // SSID captured in the profile.
  string ssid = 7;
}

// ─── Network Route Interception ───

// Envelope for client → daemon messages on the NetworkRoute stream.
message NetworkRouteClientMessage {
  oneof msg {
    RegisterRouteRequest register_route = 1;
    UnregisterRouteRequest unregister_route = 2;
    RouteDecision route_decision = 3;
    SubscribeNetworkEvents subscribe_events = 4;
    UnsubscribeNetworkEvents unsubscribe_events = 5;
  }
}

// Envelope for daemon → client messages on the NetworkRoute stream.
message NetworkRouteServerMessage {
  oneof msg {
    RegisterRouteResponse register_route_response = 1;
    InterceptedRequest intercepted_request = 2;
    UnregisterRouteResponse unregister_route_response = 3;
    FetchedResponse fetched_response = 4;
    NetworkRequestEvent request_event = 5;
    NetworkResponseEvent response_event = 6;
  }
}

// ─── Route Registration ───

message RegisterRouteRequest {
  // Client-generated UUID identifying this route.
  string route_id = 1;
  // URL glob pattern (Playwright semantics: * matches except /, ** matches all).
  string url_pattern = 2;
}

message RegisterRouteResponse {
  string route_id = 1;
  bool success = 2;
  string error_message = 3;
}

message UnregisterRouteRequest {
  string route_id = 1;
}

message UnregisterRouteResponse {
  string route_id = 1;
  bool success = 2;
}

// ─── Interception ───

// Sent by the daemon when a request matches a registered route.
// The proxy pauses the request until a RouteDecision arrives.
message InterceptedRequest {
  // Unique ID for this interception (maps RouteDecision back to the request).
  string intercept_id = 1;
  // Which registered route matched.
  string route_id = 2;
  string method = 3;
  string url = 4;
  repeated HeaderEntry headers = 5;
  bytes body = 6;
  bool is_https = 7;
}

// SDK → daemon: what to do with an intercepted request.
message RouteDecision {
  string intercept_id = 1;
  oneof action {
    RouteAbort abort = 2;
    RouteContinue continue_request = 3;
    RouteFulfill fulfill = 4;
    RouteFetch fetch = 5;
    // Used after a RouteFetch: the daemon sent a FetchedResponse, and the
    // SDK now provides the final (possibly modified) response to return.
    RouteFulfill fulfill_after_fetch = 6;
  }
}

message RouteAbort {
  // Error reason: "connectionrefused", "connectionreset", "timedout", etc.
  // Empty string = generic connection reset.
  string error_code = 1;
}

message RouteContinue {
  // Override fields. Empty/zero = keep original value.
  string url = 1;
  string method = 2;
  repeated HeaderEntry headers = 3;
  bytes post_data = 4;
}

message RouteFulfill {
  int32 status = 1;                  // HTTP status code (default 200)
  repeated HeaderEntry headers = 2;
  bytes body = 3;
  string content_type = 4;
}

message RouteFetch {
  // Override fields for the upstream request. Empty = keep original.
  string url = 1;
  string method = 2;
  repeated HeaderEntry headers = 3;
  bytes post_data = 4;
}

// Daemon → SDK: the real upstream response (sent after RouteFetch).
// The SDK inspects/modifies this and sends a RouteDecision.fulfill_after_fetch.
message FetchedResponse {
  string intercept_id = 1;
  int32 status = 2;
  repeated HeaderEntry headers = 3;
  bytes body = 4;
}

// Shared key-value pair for HTTP headers.
message HeaderEntry {
  string name = 1;
  string value = 2;
}

// ─── Network Events (non-blocking notifications) ───

// Subscribe to request/response events for all proxied traffic.
// Events are informational only — they do not block requests.
message SubscribeNetworkEvents {}

message UnsubscribeNetworkEvents {}

// Fired when a request is sent upstream (or fulfilled by a route).
message NetworkRequestEvent {
  string method = 1;
  string url = 2;
  repeated HeaderEntry headers = 3;
  bytes body = 4;
  bool is_https = 5;
  // Non-empty if this request was intercepted by a route.
  string route_action = 6;
}

// Fired when a response is received from upstream (or synthesized by a route).
message NetworkResponseEvent {
  string method = 1;
  string url = 2;
  int32 status = 3;
  repeated HeaderEntry headers = 4;
  bytes body = 5;
  string route_action = 6;
}

// ─── WebView Testing (PILOT-116) ───

message WebViewInfo {
  string socket_name = 1;
  int32 pid = 2;
  string package_name = 3;
  string url = 4;
  string title = 5;
}

message ListWebViewsRequest {
  string request_id = 1;
}

message ListWebViewsResponse {
  string request_id = 1;
  repeated WebViewInfo webviews = 2;
  string error_message = 3;
}

message ForwardWebViewPortRequest {
  string request_id = 1;
  string socket_name = 2;
}

message ForwardWebViewPortResponse {
  string request_id = 1;
  bool success = 2;
  uint32 local_port = 3;
  string error_message = 4;
}

message CloseWebViewPortRequest {
  string request_id = 1;
  uint32 local_port = 2;
}

// ─── Video Recording (PILOT-114) ───

message StartVideoRecordingRequest {
  string request_id = 1;
  // Optional output size. Honored on Android via `screenrecord --size WxH`;
  // ignored on iOS sim and physical (the daemon emits a one-time warning).
  // Set both to 0 (the proto default) for native resolution.
  uint32 size_width = 2;
  uint32 size_height = 3;
}

message StopVideoRecordingRequest {
  string request_id = 1;
}

message StopVideoRecordingResponse {
  string request_id = 1;
  bool success = 2;
  // Host-local filesystem path to the finalised MP4. The SDK is
  // responsible for copying/moving the file to its output directory and
  // cleaning up. Empty when success == false.
  string video_path = 3;
  string error_message = 4;
  // Wall-clock duration of the recording in milliseconds. Useful for
  // surfacing "exceeded screenrecord 3-min limit" warnings to the user.
  uint64 duration_ms = 5;
}
